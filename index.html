<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b111a">
<title>VTS — Virtual Trucking System</title>
<style>
:root{--bg:#0b111a;--panel:#131d2a;--panel2:#192638;--blue:#438cff;--text:#f0f5ff;--muted:#91a2ba;--border:#26364a;--green:#42d6a0;--gold:#f5c96a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:30px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{padding:15px 16px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,17,26,.96);backdrop-filter:blur(16px);z-index:15}
.menu-button{width:44px;height:44px;border:1px solid var(--border);border-radius:13px;background:var(--panel);color:var(--text);font-size:24px;display:grid;place-items:center;flex-shrink:0}
.logo{font-size:25px;font-weight:850;letter-spacing:2px}
.logo span{color:var(--blue)}
.subtitle{font-size:10px;color:var(--muted);letter-spacing:1.2px;margin-top:3px}
.status{font-size:10px;color:var(--green);background:#12332d;padding:7px 9px;border-radius:20px;margin-left:auto;white-space:nowrap}
main{max-width:850px;margin:auto;padding:22px 16px}
.eyebrow{color:var(--blue);font-size:11px;font-weight:700;letter-spacing:1.5px}
h1{font-size:28px;margin:8px 0 7px}
.description{color:var(--muted);font-size:14px;line-height:1.55}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:18px 0}
.card{background:linear-gradient(145deg,#162437,#121c29);border:1px solid var(--border);border-radius:17px;padding:15px;min-width:0}
.card-label{font-size:12px;color:var(--muted)}
.card-value{font-size:22px;font-weight:750;margin-top:10px;overflow-wrap:anywhere}
.card-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#1e3552;color:#8fc0ff;margin-bottom:13px}
.section-title{font-size:17px;font-weight:750;margin:25px 0 12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.muted{color:var(--muted);font-size:13px}
.primary,.secondary,.danger{border:0;border-radius:11px;padding:12px 15px;font-weight:650}
.primary{background:var(--blue);color:white}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.danger{background:#48212a;color:#ffb5c0}
.full{width:100%;margin-top:12px}
input,select,textarea{width:100%;background:#0d1622;border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;margin-top:6px}
label{display:block;font-size:13px;color:var(--muted);margin-top:14px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{padding:13px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item-title{font-weight:650}
.item-sub{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:23px 8px;font-size:13px;line-height:1.6}
.small-button{font-size:11px;padding:7px 9px}
.notice{color:var(--muted);font-size:12px;line-height:1.5;margin-top:12px}
.icon{width:21px;height:21px;display:inline-block;vertical-align:middle;flex-shrink:0}
.news-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:0}
.news-icon{width:38px;height:38px;display:grid;place-items:center;background:#1d3048;border-radius:12px;color:#82b7ff;flex-shrink:0}
.news-text{font-size:13px;line-height:1.5}
.news-time{font-size:11px;color:var(--muted);margin-top:4px}
.order-route{display:flex;gap:10px;align-items:center;margin:16px 0}
.route-dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px #203754;flex-shrink:0}
.route-line{height:26px;border-left:1px dashed #4c6381;margin:5px 0 5px 4px}
.route-info{min-width:0}
.route-city{font-weight:700;overflow-wrap:anywhere}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:30;opacity:0;visibility:hidden;transition:.22s}
.overlay.open{opacity:1;visibility:visible}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(82vw,320px);background:#101a28;border-right:1px solid var(--border);z-index:31;transform:translateX(-102%);transition:transform .24s ease;padding:20px 15px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.drawer.open{transform:translateX(0)}
.drawer-top{display:flex;align-items:center;justify-content:space-between;padding:5px 2px 18px;border-bottom:1px solid var(--border);margin-bottom:8px}
.close-menu{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;width:38px;height:38px;font-size:22px}
.drawer-link{display:flex;align-items:center;gap:13px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:13px;border-radius:12px;font-weight:600}
.drawer-link.active{background:#172b45;border-color:#294466;color:#8fc0ff}
.drawer-link .icon{width:22px;height:22px}
.drawer-footer{margin-top:auto;border-top:1px solid var(--border);padding:14px 5px 0;color:var(--muted);font-size:11px;line-height:1.6}
@media(min-width:600px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}main{padding-top:30px}.card-value{font-size:21px}}
@media(max-width:360px){.status{display:none}.form-grid{grid-template-columns:1fr}.card-value{font-size:20px}}
</style>
</head>
<body>

<header>
  <button class="menu-button" aria-label="Открыть меню" onclick="toggleMenu(true)">☰</button>
  <div>
    <div class="logo">V<span>T</span>S</div>
    <div class="subtitle">VIRTUAL TRUCKING SYSTEM · ETS2</div>
  </div>
  <div class="status">● Система готова</div>
</header>

<div class="overlay" id="overlay" onclick="toggleMenu(false)"></div>

<aside class="drawer" id="drawer" aria-label="Главное меню">
  <div class="drawer-top">
    <div>
      <div class="logo">V<span>T</span>S</div>
      <div class="subtitle">ГЛАВНОЕ МЕНЮ</div>
    </div>
    <button class="close-menu" aria-label="Закрыть меню" onclick="toggleMenu(false)">×</button>
  </div>

  <button class="drawer-link active" data-page="home" onclick="showPage('home')">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
    Главная
  </button>

  <button class="drawer-link" data-page="trips" onclick="showPage('trips')">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
    Рейсы
  </button>

  <button class="drawer-link" data-page="orders" onclick="showPage('orders')">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    Заказы
  </button>

  <button class="drawer-link" data-page="bank" onclick="showPage('bank')">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
    Банк
  </button>

  <button class="drawer-link" data-page="profile" onclick="showPage('profile')">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    Профиль
  </button>

  <div class="drawer-footer">Дополнительные разделы появятся здесь в будущих обновлениях.<br>VTS · Virtual Trucking System</div>
</aside>

<main id="app"></main>

<script>
const KEY = 'vts_data_v1';

function freshData(){
  return {
    profile:{
      name:'Водитель VTS',
      company:'Моя транспортная компания',
      position:'Водитель'
    },
    trips:[],
    orders:[],
    transactions:[],
    balance:0
  };
}

function loadData(){
  try{
    const saved=localStorage.getItem(KEY);
    return saved ? {...freshData(),...JSON.parse(saved)} : freshData();
  }catch(e){
    return freshData();
  }
}

let data=loadData();
let page='home';

function saveData(){
  try{
    localStorage.setItem(KEY,JSON.stringify(data));
  }catch(e){
    alert('Не удалось сохранить данные на этом устройстве.');
  }
}

function esc(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function money(n){
  return new Intl.NumberFormat('ru-RU',{
    style:'currency',
    currency:'RUB',
    maximumFractionDigits:0
  }).format(Number(n)||0);
}

function distance(){
  return data.trips.reduce((s,t)=>s+(Number(t.distance)||0),0);
}

function earnings(){
  return data.trips.reduce((s,t)=>s+(Number(t.net)||0),0);
}

function todayKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function dateKey(value){
  if(!value)return '';
  const s=String(value);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const d=new Date(s);
  return Number.isNaN(d.getTime()) ? '' : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function todayTrips(){
  return data.trips.filter(t=>dateKey(t.date)===todayKey());
}

function showPage(next){
  page=next;
  toggleMenu(false);
  document.querySelectorAll('.drawer-link').forEach(b=>{
    b.classList.toggle('active',b.dataset.page===page);
  });
  render();
  window.scrollTo(0,0);
}

function toggleMenu(open){
  document.getElementById('drawer').classList.toggle('open',open);
  document.getElementById('overlay').classList.toggle('open',open);
  document.body.style.overflow=open?'hidden':'';
}

function empty(message){
  return `<div class="empty">${message}</div>`;
}

function tripList(){
  if(!data.trips.length){
    return empty('Завершённых рейсов пока нет.<br>Добавь первый рейс, чтобы начать историю.');
  }

  return data.trips.slice().reverse().map(t=>`
    <div class="item">
      <div class="row">
        <div class="item-title">${esc(t.from)} → ${esc(t.to)}</div>
        <button class="danger small-button" onclick="deleteTrip('${t.id}')">Удалить</button>
      </div>
      <div class="item-sub">
        ${esc(t.date)} · ${Number(t.distance)||0} км · ${esc(t.cargo||'Без указания груза')}
      </div>
      <div class="item-sub">
        Доход: ${money(t.net)} · Комиссия: ${Number(t.fee)||0}%
      </div>
    </div>
  `).join('');
}

function orderList(){
  if(!data.orders.length){
    return empty('Активных заказов пока нет.<br>Создай заказ, чтобы начать перевозку.');
  }

  return data.orders.slice().reverse().map(o=>`
    <div class="item">
      <div class="row">
        <div class="item-title">${esc(o.from)} → ${esc(o.to)}</div>
        <button class="danger small-button" onclick="deleteOrder('${o.id}')">Отменить</button>
      </div>
      <div class="order-route">
        <div>
          <div class="route-dot"></div>
          <div class="route-line"></div>
          <div class="route-dot"></div>
        </div>
        <div class="route-info">
          <div class="route-city">${esc(o.from)}</div>
          <div class="item-sub">${esc(o.date)} · ${Number(o.distance)||0} км</div>
          <div class="route-city" style="margin-top:12px">${esc(o.to)}</div>
        </div>
      </div>
      <div class="item-sub">Груз: ${esc(o.cargo||'Не указан')}</div>
      <div class="item-sub">Оплата: ${money(o.pay)}</div>
      <button class="primary full" onclick="completeOrder('${o.id}')">Завершить заказ</button>
    </div>
  `).join('');
}

function bankList(){
  if(!data.transactions.length){
    return empty('Операций пока нет.');
  }

  return data.transactions.slice().reverse().map(t=>`
    <div class="item">
      <div class="row">
        <div>
          <div class="item-title">${esc(t.title)}</div>
          <div class="item-sub">${esc(t.date)}</div>
        </div>
        <strong style="color:var(--green)">+${money(t.amount)}</strong>
      </div>
    </div>
  `).join('');
}

function activeOrderCard(){
  if(!data.orders.length){
    return `<div class="panel">${empty('Сейчас у тебя нет активных заказов.<br>Новые заказы можно добавить в разделе «Заказы».')}</div>`;
  }

  const o=data.orders[data.orders.length-1];

  return `
    <div class="panel">
      <div class="row">
        <span class="eyebrow">ЗАКАЗ ПРИНЯТ</span>
        <span class="muted">${esc(o.date)}</span>
      </div>
      <div class="order-route">
        <div>
          <div class="route-dot"></div>
          <div class="route-line"></div>
          <div class="route-dot"></div>
        </div>
        <div class="route-info">
          <div class="route-city">${esc(o.from)}</div>
          <div class="item-sub">${Number(o.distance)||0} км · ${esc(o.cargo||'Груз не указан')}</div>
          <div class="route-city" style="margin-top:12px">${esc(o.to)}</div>
        </div>
      </div>
      <div class="row">
        <div>
          <div class="muted">Оплата за заказ</div>
          <strong>${money(o.pay)}</strong>
        </div>
        <button class="secondary" onclick="showPage('orders')">Открыть заказ</button>
      </div>
    </div>
  `;
}

function newsFeed(){
  const events=[];

  data.orders.slice(-3).reverse().forEach(o=>{
    events.push({
      title:`Принят заказ: ${o.from} — ${o.to}`,
      date:o.date,
      icon:'order'
    });
  });

  data.trips.slice(-3).reverse().forEach(t=>{
    events.push({
      title:`Рейс завершён: ${t.from} — ${t.to}`,
      date:t.date,
      icon:'trip'
    });
  });

  data.transactions.slice(-3).reverse().forEach(t=>{
    events.push({
      title:`Зачислено ${money(t.amount)} — ${t.title}`,
      date:t.date,
      icon:'money'
    });
  });

  if(!events.length){
    return `
      <div class="news-item">
        <div class="news-icon">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3v18M3 12h18"/>
          </svg>
        </div>
        <div>
          <div class="news-text"><strong>Добро пожаловать в VTS!</strong><br>Твоя виртуальная карьера водителя начинается здесь.</div>
          <div class="news-time">Системное сообщение</div>
        </div>
      </div>
    `;
  }

  return events.slice(0,7).map(e=>`
    <div class="news-item">
      <div class="news-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          ${e.icon==='order'
            ? '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>'
            : e.icon==='trip'
              ? '<path d="M3 17h18M5 17l2-8h10l2 8M9 9l2-4h4l2 4"/>'
              : '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/>'
          }
        </svg>
      </div>
      <div>
        <div class="news-text">${esc(e.title)}</div>
        <div class="news-time">${esc(e.date)}</div>
      </div>
    </div>
  `).join('');
}

function render(){
  const app=document.getElementById('app');

  if(page==='home'){
    const todays=todayTrips();
    const todayKm=todays.reduce((s,t)=>s+(Number(t.distance)||0),0);
    const todayNet=todays.reduce((s,t)=>s+(Number(t.net)||0),0);

    app.innerHTML=`
      <div class="eyebrow">ПАНЕЛЬ ВОДИТЕЛЯ · ETS2</div>
      <h1>Главная</h1>
      <div class="description">Добро пожаловать, ${esc(data.profile.name)}. Здесь собраны события и результаты твоего рабочего дня.</div>

      <div class="section-title">Сводка за сегодня</div>
      <div class="cards">
        <div class="card">
          <div class="card-icon">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17h18M5 17l2-8h10l2 8M9 9l2-4h4l2 4"/></svg>
          </div>
          <div class="card-label">Пробег сегодня</div>
          <div class="card-value">${todayKm.toLocaleString('ru-RU')} км</div>
        </div>

        <div class="card">
          <div class="card-icon">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 12 4 4L19 6"/><circle cx="12" cy="12" r="9"/></svg>
          </div>
          <div class="card-label">Завершено рейсов</div>
          <div class="card-value">${todays.length}</div>
        </div>

        <div class="card">
          <div class="card-icon">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
          </div>
          <div class="card-label">Заработок сегодня</div>
          <div class="card-value">${money(todayNet)}</div>
        </div>

        <div class="card">
          <div class="card-icon">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </div>
          <div class="card-label">Время в рейсах</div>
          <div class="card-value" style="font-size:17px">Пока нет данных</div>
        </div>
      </div>

      <div class="section-title">Активный заказ</div>
      ${activeOrderCard()}

      <div class="section-title">Новости и последние события</div>
      <div class="panel">${newsFeed()}</div>

      <div class="notice">Статистика считается по завершённым рейсам, дата которых совпадает с сегодняшним днём. Время в пути появится после обновления журнала рейсов.</div>
    `;

  }else if(page==='trips'){

    app.innerHTML=`
      <div class="eyebrow">ЖУРНАЛ ПЕРЕВОЗОК</div>
      <h1>История рейсов</h1>
      <div class="description">Записывай маршруты, пробег и доходы своих поездок.</div>

      <div class="section-title">Новый завершённый рейс</div>
      <form class="panel" onsubmit="addTrip(event)">
        <div class="form-grid">
          <div><label>Откуда</label><input name="from" required placeholder="Берлин"></div>
          <div><label>Куда</label><input name="to" required placeholder="Прага"></div>
        </div>

        <div class="form-grid">
          <div><label>Дата</label><input name="date" type="date" required></div>
          <div><label>Расстояние, км</label><input name="distance" type="number" min="0" required placeholder="350"></div>
        </div>

        <label>Груз</label>
        <input name="cargo" placeholder="Например, продукты">

        <div class="form-grid">
          <div><label>Доход, ₽</label><input name="gross" type="number" min="0" required placeholder="50000"></div>
          <div><label>Комиссия, %</label><input name="fee" type="number" min="0" max="100" value="10" required></div>
        </div>

        <label><input name="credit" type="checkbox" style="width:auto;margin-right:7px">Зачислить чистый доход в банк</label>
        <button class="primary full" type="submit">Сохранить рейс</button>
      </form>

      <div class="section-title">Все рейсы · ${data.trips.length}</div>
      <div class="panel">${tripList()}</div>
    `;

    const date=app.querySelector('[name="date"]');
    if(date)date.value=todayKey();

  }else if(page==='orders'){

    app.innerHTML=`
      <div class="eyebrow">ПЛАНИРОВАНИЕ ПЕРЕВОЗОК</div>
      <h1>Диспетчерская</h1>
      <div class="description">Создавай заказы и завершай их после доставки груза.</div>

      <div class="section-title">Новый заказ</div>
      <form class="panel" onsubmit="addOrder(event)">
        <div class="form-grid">
          <div><label>Откуда</label><input name="from" required placeholder="Город загрузки"></div>
          <div><label>Куда</label><input name="to" required placeholder="Город доставки"></div>
        </div>

        <label>Дата доставки</label>
        <input name="date" type="date" required>

        <label>Груз</label>
        <input name="cargo" placeholder="Тип груза">

        <div class="form-grid">
          <div><label>Расстояние, км</label><input name="distance" type="number" min="0" required></div>
          <div><label>Оплата, ₽</label><input name="pay" type="number" min="0" required></div>
        </div>

        <button class="primary full" type="submit">＋ Создать заказ</button>
      </form>

      <div class="section-title">Запланированные заказы · ${data.orders.length}</div>
      <div class="panel">${orderList()}</div>
    `;

  }else if(page==='bank'){

    app.innerHTML=`
      <div class="eyebrow">ФИНАНСЫ ВИРТУАЛЬНОГО ПРОЕКТА</div>
      <h1>Виртуальный банк</h1>

      <div class="card">
        <div class="card-label">Текущий баланс</div>
        <div class="card-value">${money(data.balance)}</div>
        <div class="notice">Виртуальные средства VTS. Это не настоящий банковский счёт.</div>
      </div>

      <div class="section-title">Пополнение баланса</div>
      <form class="panel" onsubmit="deposit(event)">
        <label>Сумма, ₽</label>
        <input name="amount" type="number" min="1" required placeholder="10000">
        <label>Описание</label>
        <input name="title" placeholder="Начальный капитал">
        <button class="primary full" type="submit">Пополнить виртуальный счёт</button>
      </form>

      <div class="section-title">История операций</div>
      <div class="panel">${bankList()}</div>
    `;

  }else{

    app.innerHTML=`
      <div class="eyebrow">ЛИЧНЫЕ ДАННЫЕ</div>
      <h1>Профиль водителя</h1>

      <div class="card" style="text-align:center;padding:25px">
        <div style="font-size:42px">👤</div>
        <div class="card-value">${esc(data.profile.name)}</div>
        <div class="muted" style="margin-top:8px">${esc(data.profile.position)}</div>
        <div class="muted" style="margin-top:5px">${esc(data.profile.company)}</div>
      </div>

      <div class="section-title">Редактировать профиль</div>
      <form class="panel" onsubmit="saveProfile(event)">
        <label>Имя или никнейм</label>
        <input name="name" required value="${esc(data.profile.name)}">

        <label>Транспортная компания</label>
        <input name="company" value="${esc(data.profile.company)}">

        <label>Должность</label>
        <input name="position" value="${esc(data.profile.position)}">

        <button class="primary full" type="submit">Сохранить профиль</button>
      </form>

      <div class="section-title">Статистика за карьеру</div>
      <div class="cards">
        <div class="card">
          <div class="card-label">Завершено рейсов</div>
          <div class="card-value">${data.trips.length}</div>
        </div>
        <div class="card">
          <div class="card-label">Общий пробег</div>
          <div class="card-value">${distance().toLocaleString('ru-RU')} км</div>
        </div>
        <div class="card">
          <div class="card-label">Чистый заработок</div>
          <div class="card-value">${money(earnings())}</div>
        </div>
        <div class="card">
          <div class="card-label">Активные заказы</div>
          <div class="card-value">${data.orders.length}</div>
        </div>
      </div>

      <div class="section-title">Резервная копия</div>
      <div class="panel">
        <button class="secondary full" onclick="exportData()">Экспортировать данные JSON</button>
        <label>Восстановить из JSON-файла</label>
        <input type="file" accept=".json,application/json" onchange="importData(event)">
        <div class="notice">Данные сохраняются в браузере этого устройства. Экспортируй резервную копию, чтобы не потерять записи.</div>
      </div>
    `;
  }
}

function addTrip(e){
  e.preventDefault();
  const f=new FormData(e.target);
  const gross=Number(f.get('gross'))||0;
  const fee=Number(f.get('fee'))||0;
  const net=gross-gross*fee/100;

  const t={
    id:crypto.randomUUID(),
    from:f.get('from'),
    to:f.get('to'),
    date:f.get('date'),
    distance:Number(f.get('distance')),
    cargo:f.get('cargo'),
    gross,
    fee,
    net
  };

  data.trips.push(t);

  if(f.get('credit')){
    data.balance+=net;
    data.transactions.push({
      id:crypto.randomUUID(),
      title:'Доход за рейс: '+t.from+' — '+t.to,
      date:t.date,
      amount:net
    });
  }

  saveData();
  showPage('trips');
}

function deleteTrip(id){
  if(!confirm('Удалить этот рейс?'))return;
  data.trips=data.trips.filter(t=>t.id!==id);
  saveData();
  render();
}

function addOrder(e){
  e.preventDefault();
  const f=new FormData(e.target);

  data.orders.push({
    id:crypto.randomUUID(),
    from:f.get('from'),
    to:f.get('to'),
    date:f.get('date'),
    cargo:f.get('cargo'),
    distance:Number(f.get('distance')),
    pay:Number(f.get('pay'))
  });

  saveData();
  showPage('orders');
}

function deleteOrder(id){
  if(!confirm('Отменить этот заказ?'))return;
  data.orders=data.orders.filter(o=>o.id!==id);
  saveData();
  render();
}

function completeOrder(id){
  const o=data.orders.find(o=>o.id===id);
  if(!o)return;

  if(!confirm('Перенести заказ в историю завершённых рейсов? Доход будет равен оплате минус комиссия 10%.'))return;

  const gross=Number(o.pay)||0;
  const fee=10;
  const net=gross-gross*fee/100;

  data.trips.push({
    ...o,
    id:crypto.randomUUID(),
    gross,
    fee,
    net
  });

  data.orders=data.orders.filter(x=>x.id!==id);
  data.balance+=net;

  data.transactions.push({
    id:crypto.randomUUID(),
    title:'Доход за заказ: '+o.from+' — '+o.to,
    date:o.date,
    amount:net
  });

  saveData();
  showPage('trips');
}

function deposit(e){
  e.preventDefault();
  const f=new FormData(e.target);
  const amount=Number(f.get('amount'));

  if(amount<=0)return;

  data.balance+=amount;

  data.transactions.push({
    id:crypto.randomUUID(),
    title:f.get('title')||'Пополнение виртуального счёта',
    date:todayKey(),
    amount
  });

  saveData();
  render();
}

function saveProfile(e){
  e.preventDefault();
  const f=new FormData(e.target);

  data.profile={
    name:f.get('name'),
    company:f.get('company'),
    position:f.get('position')
  };

  saveData();
  render();
}

function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');

  a.href=url;
  a.download='VTS-backup.json';
  a.click();

  URL.revokeObjectURL(url);
}

function importData(e){
  const file=e.target.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const imported=JSON.parse(reader.result);

      if(!imported.profile||
         !Array.isArray(imported.trips)||
         !Array.isArray(imported.orders)||
         !Array.isArray(imported.transactions)||
         !Number.isFinite(Number(imported.balance))){
        throw Error();
      }

      if(!confirm('Заменить текущие данные содержимым резервной копии?'))return;

      data=imported;
      saveData();
      showPage('profile');
      alert('Данные восстановлены.');
    }catch(err){
      alert('Не удалось прочитать резервную копию VTS.');
    }
  };

  reader.readAsText(file);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')toggleMenu(false);
});

render();
</script>
</body>
</html>
