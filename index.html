<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b111a">
<title>VTS — Virtual Trucking System</title>
<style>
:root{--bg:#0b111a;--panel:#131d2a;--panel2:#192638;--blue:#438cff;--text:#f0f5ff;--muted:#91a2ba;--border:#26364a;--green:#42d6a0;--gold:#f5c96a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:30px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{padding:15px 16px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,17,26,.96);backdrop-filter:blur(16px);z-index:15}
.menu-button{width:44px;height:44px;border:1px solid var(--border);border-radius:13px;background:var(--panel);color:var(--text);font-size:24px;display:grid;place-items:center;flex-shrink:0}
.logo{font-size:25px;font-weight:850;letter-spacing:2px}
.logo span{color:var(--blue)}
.subtitle{font-size:10px;color:var(--muted);letter-spacing:1.2px;margin-top:3px}
.status{font-size:10px;color:var(--green);background:#12332d;padding:7px 9px;border-radius:20px;margin-left:auto;white-space:nowrap}
main{max-width:850px;margin:auto;padding:22px 16px}
.eyebrow{color:var(--blue);font-size:11px;font-weight:700;letter-spacing:1.5px}
h1{font-size:28px;margin:8px 0 7px}
.description{color:var(--muted);font-size:14px;line-height:1.55}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:18px 0}
.card{background:linear-gradient(145deg,#162437,#121c29);border:1px solid var(--border);border-radius:17px;padding:15px;min-width:0}
.card-label{font-size:12px;color:var(--muted)}
.card-value{font-size:22px;font-weight:750;margin-top:10px;overflow-wrap:anywhere}
.card-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#1e3552;color:#8fc0ff;margin-bottom:13px}
.section-title{font-size:17px;font-weight:750;margin:25px 0 12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.muted{color:var(--muted);font-size:13px}
.primary,.secondary,.danger{border:0;border-radius:11px;padding:12px 15px;font-weight:650}
.primary{background:var(--blue);color:white}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.danger{background:#48212a;color:#ffb5c0}
.full{width:100%;margin-top:12px}
input,select,textarea{width:100%;background:#0d1622;border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;margin-top:6px}
label{display:block;font-size:13px;color:var(--muted);margin-top:14px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{padding:13px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item-title{font-weight:650}
.item-sub{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:23px 8px;font-size:13px;line-height:1.6}
.small-button{font-size:11px;padding:7px 9px}
.notice{color:var(--muted);font-size:12px;line-height:1.5;margin-top:12px}
.icon{width:21px;height:21px;display:inline-block;vertical-align:middle;flex-shrink:0}
.news-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:0}
.news-icon{width:38px;height:38px;display:grid;place-items:center;background:#1d3048;border-radius:12px;color:#82b7ff;flex-shrink:0}
.news-text{font-size:13px;line-height:1.5}
.news-time{font-size:11px;color:var(--muted);margin-top:4px}
.order-route{display:flex;gap:10px;align-items:center;margin:16px 0}
.route-dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px #203754;flex-shrink:0}
.route-line{height:26px;border-left:1px dashed #4c6381;margin:5px 0 5px 4px}
.route-info{min-width:0}
.route-city{font-weight:700;overflow-wrap:anywhere}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:30;opacity:0;visibility:hidden;transition:.22s}
.overlay.open{opacity:1;visibility:visible}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(82vw,320px);background:#101a28;border-right:1px solid var(--border);z-index:31;transform:translateX(-102%);transition:transform .24s ease;padding:20px 15px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.drawer.open{transform:translateX(0)}
.drawer-top{display:flex;align-items:center;justify-content:space-between;padding:5px 2px 18px;border-bottom:1px solid var(--border);margin-bottom:8px}
.close-menu{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;width:38px;height:38px;font-size:22px}
.drawer-link{display:flex;align-items:center;gap:13px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:13px;border-radius:12px;font-weight:600}
.drawer-link.active{background:#172b45;border-color:#294466;color:#8fc0ff}
.drawer-link .icon{width:22px;height:22px}
.drawer-footer{margin-top:auto;border-top:1px solid var(--border);padding:14px 5px 0;color:var(--muted);font-size:11px;line-height:1.6}
.profile-hero{position:relative;overflow:hidden;background:radial-gradient(circle at 90% 10%,#244b79 0,transparent 38%),linear-gradient(145deg,#172b43,#101a28);border:1px solid #2a4565;border-radius:22px;padding:22px;margin-top:16px}
.profile-hero:after{content:"VTS";position:absolute;right:8px;bottom:-25px;font-size:100px;font-weight:900;letter-spacing:-7px;color:rgba(150,190,240,.055);pointer-events:none}
.profile-top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.avatar{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#3b82d9,#24446b);font-size:25px;font-weight:850;box-shadow:0 8px 25px #07101d80;flex-shrink:0}
.profile-name{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.profile-meta{font-size:12px;color:#a9bfd9;margin-top:5px}
.rating-pill{display:inline-flex;align-items:center;gap:5px;background:#332c1b;border:1px solid #5b4b2a;color:#ffd36b;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:750;margin-top:9px}
.edit-icon{margin-left:auto;width:42px;height:42px;border-radius:13px;background:#203650;border:1px solid #355575;color:#dcecff;font-size:18px;flex-shrink:0}
.profile-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}
.profile-tag{border:1px solid #334a63;background:#132338;color:#d4e4f8;border-radius:9px;padding:7px 9px;font-size:11px}
.profile-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:13px 0}
.stat-tile{background:linear-gradient(145deg,#172638,#111b28);border:1px solid var(--border);border-radius:16px;padding:14px;min-width:0}
.stat-symbol{font-size:19px;margin-bottom:9px}
.stat-number{font-size:20px;font-weight:800;overflow-wrap:anywhere;margin-top:5px}
.stat-label{font-size:11px;color:var(--muted);line-height:1.4}
.stat-foot{font-size:10px;color:#8fa6c0;margin-top:7px}
.chart-panel{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:15px;margin-top:12px}
.chart-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chart-title{font-size:14px;font-weight:750}
.chart-total{font-size:20px;font-weight:800;margin-top:7px}
.period-switch{display:flex;gap:4px;background:#0d1622;padding:4px;border-radius:10px;border:1px solid var(--border);margin-top:14px}
.period-switch button{flex:1;border:0;border-radius:7px;background:transparent;color:var(--muted);padding:8px 5px;font-size:11px}
.period-switch button.active{background:#244a78;color:white}
.bar-chart{height:145px;display:flex;align-items:stretch;gap:8px;padding-top:17px;border-bottom:1px solid #34465c;margin-top:10px}
.bar-col{display:flex;flex:1;min-width:0;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}
.bar-value{font-size:9px;color:#a8bed7;white-space:nowrap;max-width:100%;overflow:hidden}
.bar-track{height:100px;width:min(100%,25px);display:flex;align-items:flex-end;justify-content:center}
.bar-fill{width:100%;min-height:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#69b2ff,#3479d4);box-shadow:0 0 15px #3987ed22}
.bar-label{font-size:10px;color:var(--muted);margin-bottom:-19px;transform:translateY(21px)}
.chart-legend{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-top:29px}
.legend-dot{width:8px;height:8px;background:#4d9af5;border-radius:50%}
.profile-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.achievement{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--border)}
.achievement:last-child{border-bottom:0}
.achievement-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#20354d;font-size:19px;flex-shrink:0}
.achievement-title{font-size:13px;font-weight:700}
.achievement-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
.achievement-state{margin-left:auto;color:var(--green);font-size:10px;white-space:nowrap}
.rating-stars{display:flex;gap:8px;margin-top:10px}
.rating-stars button{border:1px solid var(--border);background:#101a28;color:#53647a;border-radius:10px;font-size:25px;flex:1;padding:7px 2px}
.rating-stars button.selected{color:#ffd36b;background:#332c1b;border-color:#715d31}
.profile-edit{display:none;margin-top:12px}
.profile-edit.open{display:block}
.profile-edit .panel{border-color:#355579}
.recent-trip{padding:12px 0;border-bottom:1px solid var(--border)}
.recent-trip:last-child{border-bottom:0}
@media(min-width:600px){.profile-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.bar-chart{height:175px}.bar-track{height:125px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}main{padding-top:30px}.card-value{font-size:21px}}
@media(max-width:360px){.status{display:none}.form-grid{grid-template-columns:1fr}.card-value{font-size:20px}}
</style>
</head>
<body>
<header>
<button class="menu-button" aria-label="Открыть меню" onclick="toggleMenu(true)">☰</button>
<div><div class="logo">V<span>T</span>S</div><div class="subtitle">VIRTUAL TRUCKING SYSTEM · ETS2</div></div>
<div class="status">● Система готова</div>
</header>
<div class="overlay" id="overlay" onclick="toggleMenu(false)"></div>
<aside class="drawer" id="drawer" aria-label="Главное меню">
<div class="drawer-top"><div><div class="logo">V<span>T</span>S</div><div class="subtitle">ГЛАВНОЕ МЕНЮ</div></div><button class="close-menu" aria-label="Закрыть меню" onclick="toggleMenu(false)">×</button></div>
<button class="drawer-link active" data-page="home" onclick="showPage('home')">⌂　Главная</button>
<button class="drawer-link" data-page="trips" onclick="showPage('trips')">☷　Рейсы</button>
<button class="drawer-link" data-page="orders" onclick="showPage('orders')">▤　Заказы</button>
<button class="drawer-link" data-page="bank" onclick="showPage('bank')">▣　Банк</button>
<button class="drawer-link" data-page="profile" onclick="showPage('profile')">♙　Профиль</button>
<div class="drawer-footer">VTS · Virtual Trucking System<br>Учёт виртуальной карьеры ETS2</div>
</aside>
<main id="app"></main>
<script>
const KEY='vts_data_v1';
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function freshData(){return {profile:{name:'Водитель VTS',firstName:'',lastName:'',experience:'',company:'Моя транспортная компания',position:'Водитель',country:'',bio:'',rating:5,ratings:[],joined:todayKey()},trips:[],orders:[],transactions:[],balance:0}}
function loadData(){try{const saved=localStorage.getItem(KEY);if(!saved)return freshData();const d={...freshData(),...JSON.parse(saved)};d.profile={...freshData().profile,...(d.profile||{})};d.trips=Array.isArray(d.trips)?d.trips:[];d.orders=Array.isArray(d.orders)?d.orders:[];d.transactions=Array.isArray(d.transactions)?d.transactions:[];d.profile.ratings=Array.isArray(d.profile.ratings)?d.profile.ratings:[];return d}catch(e){return freshData()}}
let data=loadData(),page='home';
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Не удалось сохранить данные на устройстве.')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(n)||0)}
function distance(){return data.trips.reduce((s,t)=>s+(Number(t.distance)||0),0)}
function earnings(){return data.trips.reduce((s,t)=>s+(Number(t.net)||0),0)}
function dateKey(v){if(!v)return '';const s=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);return Number.isNaN(d.getTime())?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function todayTrips(){return data.trips.filter(t=>dateKey(t.date)===todayKey())}
function showPage(next){page=next;toggleMenu(false);document.querySelectorAll('.drawer-link').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();window.scrollTo(0,0)}
function toggleMenu(open){document.getElementById('drawer').classList.toggle('open',open);document.getElementById('overlay').classList.toggle('open',open);document.body.style.overflow=open?'hidden':''}
function empty(m){return `<div class="empty">${m}</div>`}
function tripList(){if(!data.trips.length)return empty('Завершённых рейсов пока нет.<br>Добавь первый рейс, чтобы начать историю.');return data.trips.slice().reverse().map(t=>`<div class="item"><div class="row"><div class="item-title">${esc(t.from)} → ${esc(t.to)}</div><button class="danger small-button" onclick="deleteTrip('${t.id}')">Удалить</button></div><div class="item-sub">${esc(t.date)} · ${Number(t.distance)||0} км · ${esc(t.cargo||'Груз не указан')}</div><div class="row" style="margin-top:9px"><span class="muted">Чистый доход</span><b>${money(t.net)}</b></div></div>`).join('')}
function orderList(){if(!data.orders.length)return empty('Заказов пока нет.<br>Создай первый заказ ниже.');return data.orders.slice().reverse().map(o=>`<div class="item"><div class="row"><div class="item-title">${esc(o.from)} → ${esc(o.to)}</div><button class="secondary small-button" onclick="completeOrder('${o.id}')">Завершить</button></div><div class="item-sub">${esc(o.date)} · ${esc(o.cargo||'Груз не указан')} · ${Number(o.distance)||0} км</div><div class="row" style="margin-top:8px"><b>${money(o.pay)}</b><button class="danger small-button" onclick="deleteOrder('${o.id}')">Отменить</button></div></div>`).join('')}
function bankList(){if(!data.transactions.length)return empty('Операций пока нет.');return data.transactions.slice().reverse().map(t=>`<div class="item"><div class="row"><div><div class="item-title">${esc(t.title)}</div><div class="item-sub">${esc(t.date)}</div></div><b style="color:${t.amount>=0?'var(--green)':'#ff8796'}">${t.amount>=0?'+':''}${money(t.amount)}</b></div></div>`).join('')}
function profileName(){const p=data.profile;return [p.firstName,p.lastName].filter(Boolean).join(' ').trim()||p.name||'Водитель VTS'}
function avgRating(){const a=(data.profile.ratings||[]).map(x=>Number(x.rating)).filter(x=>x>=1&&x<=5);return a.length?a.reduce((s,x)=>s+x,0)/a.length:Number(data.profile.rating)||0}
function periodDates(period){const now=new Date(),out=[],count=period==='year'?12:period==='month'?30:7;for(let i=count-1;i>=0;i--){const d=new Date(now);if(period==='year')d.setMonth(now.getMonth()-i,1);else d.setDate(now.getDate()-i);out.push(d)}return out}
function chartData(kind,period){return periodDates(period).map(d=>{const arr=period==='year'?data.trips.filter(t=>{const x=new Date((dateKey(t.date)||'2000-01-01')+'T12:00:00');return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()}):data.trips.filter(t=>dateKey(t.date)===dateKey(d));return {label:period==='year'?d.toLocaleDateString('ru-RU',{month:'short'}):d.toLocaleDateString('ru-RU',{weekday:'short'}).replace('.',''),value:arr.reduce((s,t)=>s+(Number(kind==='km'?t.distance:t.net)||0),0)}})}
function compactMoney(n){n=Number(n)||0;if(n>=1000000)return (n/1e6).toLocaleString('ru-RU',{maximumFractionDigits:1})+'м';if(n>=1000)return (n/1000).toLocaleString('ru-RU',{maximumFractionDigits:1})+'к';return Math.round(n).toString()}
function periodSum(kind,period){return chartData(kind,period).reduce((s,x)=>s+x.value,0)}
function renderBars(kind,period){const items=chartData(kind,period),max=Math.max(...items.map(x=>x.value),1);return `<div class="bar-chart">${items.map(x=>`<div class="bar-col"><div class="bar-value">${kind==='km'?Math.round(x.value).toLocaleString('ru-RU'):compactMoney(x.value)}</div><div class="bar-track"><div class="bar-fill" style="height:${Math.max(3,x.value/max*100)}%"></div></div><div class="bar-label">${esc(x.label)}</div></div>`).join('')}</div>`}
function setChartPeriod(p){data.profile.chartPeriod=p;render()}
function rateTrip(id,rating){const t=data.trips.find(x=>String(x.id)===String(id));if(!t)return;data.profile.ratings=data.profile.ratings||[];const old=data.profile.ratings.find(x=>String(x.tripId)===String(id));if(old)old.rating=rating;else data.profile.ratings.push({tripId:id,rating,date:dateKey(t.date)});saveData();render()}
function achievements(){const km=distance(),count=data.trips.length,net=earnings();return [{icon:'🚛',title:'Первый рейс',sub:'Заверши первый рейс',done:count>=1},{icon:'🛣️',title:'Первые 1 000 км',sub:'Накопи 1 000 км пробега',done:km>=1000},{icon:'🏅',title:'10 завершённых рейсов',sub:'Построй историю перевозок',done:count>=10},{icon:'💰',title:'Первый миллион',sub:'Получи 1 000 000 ₽ чистого дохода',done:net>=1000000},{icon:'🌍',title:'Дальнобойщик 10 000 км',sub:'Преодолей 10 000 км',done:km>=10000}]}
function profileRecentTrips(){if(!data.trips.length)return empty('Здесь появятся последние рейсы.');return data.trips.slice().reverse().slice(0,5).map(t=>{const rr=(data.profile.ratings||[]).find(x=>String(x.tripId)===String(t.id));return `<div class="recent-trip"><div class="row"><div class="item-title">${esc(t.from)} → ${esc(t.to)}</div><b>${money(t.net)}</b></div><div class="item-sub">${esc(t.date)} · ${Number(t.distance)||0} км · ${esc(t.cargo||'Груз не указан')}</div><div class="row" style="margin-top:9px"><span class="muted">Оценка рейса</span><span style="color:#ffd36b">${rr?'★'.repeat(rr.rating)+'☆'.repeat(5-rr.rating):'Не оценён'}</span></div><div class="rating-stars">${[1,2,3,4,5].map(n=>`<button type="button" class="${rr&&rr.rating===n?'selected':''}" onclick="rateTrip('${String(t.id).replace(/'/g,"\\'")}',${n})">★</button>`).join('')}</div></div>`}).join('')}
function render(){
 const app=document.getElementById('app');
 if(page==='home'){
  const todays=todayTrips(),todayKm=todays.reduce((s,t)=>s+(Number(t.distance)||0),0),todayNet=todays.reduce((s,t)=>s+(Number(t.net)||0),0);

 }else if(page==='trips'){
  app.innerHTML=`<div class="eyebrow">ЖУРНАЛ ПЕРЕВОЗОК</div><h1>История рейсов</h1><div class="description">Записывай маршруты, пробег и доходы поездок.</div><div class="section-title">Новый завершённый рейс</div><form class="panel" onsubmit="addTrip(event)"><div class="form-grid"><div><label>Откуда</label><input name="from" required placeholder="Берлин"></div><div><label>Куда</label><input name="to" required placeholder="Прага"></div></div><div class="form-grid"><div><label>Дата</label><input name="date" type="date" required></div><div><label>Расстояние, км</label><input name="distance" type="number" min="0" required placeholder="350"></div></div><label>Груз</label><input name="cargo" placeholder="Например, продукты"><div class="form-grid"><div><label>Доход, ₽</label><input name="gross" type="number" min="0" required placeholder="50000"></div><div><label>Комиссия, %</label><input name="fee" type="number" min="0" max="100" value="10" required></div></div><label><input name="credit" type="checkbox" style="width:auto;margin-right:7px">Зачислить чистый доход в банк</label><button class="primary full" type="submit">Сохранить рейс</button></form><div class="section-title">Все рейсы · ${data.trips.length}</div><div class="panel">${tripList()}</div>`;
  app.querySelector('[name="date"]').value=todayKey();
 }else if(page==='orders'){
  app.innerHTML=`<div class="eyebrow">ПЛАНИРОВАНИЕ ПЕРЕВОЗОК</div><h1>Диспетчерская</h1><div class="description">Создавай заказы и завершай их после доставки груза.</div><div class="section-title">Новый заказ</div><form class="panel" onsubmit="addOrder(event)"><div class="form-grid"><div><label>Откуда</label><input name="from" required placeholder="Город загрузки"></div><div><label>Куда</label><input name="to" required placeholder="Город доставки"></div></div><label>Дата доставки</label><input name="date" type="date" required><label>Груз</label><input name="cargo" placeholder="Тип груза"><div class="form-grid"><div><label>Расстояние, км</label><input name="distance" type="number" min="0" required></div><div><label>Оплата, ₽</label><input name="pay" type="number" min="0" required></div></div><button class="primary full" type="submit">＋ Создать заказ</button></form><div class="section-title">Запланированные заказы · ${data.orders.length}</div><div class="panel">${orderList()}</div>`;
 }else if(page==='bank'){
  app.innerHTML=`<div class="eyebrow">ВИРТУАЛЬНЫЕ ФИНАНСЫ</div><h1>Банк</h1><div class="card"><div class="card-label">Текущий баланс</div><div class="card-value">${money(data.balance)}</div><div class="notice">Виртуальные средства VTS, не настоящий банковский счёт.</div></div><div class="section-title">Пополнение баланса</div><form class="panel" onsubmit="deposit(event)"><label>Сумма, ₽</label><input name="amount" type="number" min="1" required placeholder="10000"><label>Описание</label><input name="title" placeholder="Начальный капитал"><button class="primary full" type="submit">Пополнить счёт</button></form><div class="section-title">История операций</div><div class="panel">${bankList()}</div>`;
 }else{
  const p=data.profile,allTrips=data.trips.length,km=distance(),net=earnings(),gross=data.trips.reduce((s,t)=>s+(Number(t.gross)||Number(t.net)||0),0),avgKm=allTrips?km/allTrips:0,avgNet=allTrips?net/allTrips:0,rate=avgRating(),rated=(p.ratings||[]).length,now=new Date(),monthTrips=data.trips.filter(t=>{const d=new Date((dateKey(t.date)||'2000-01-01')+'T12:00:00');return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}),todayNet=todayTrips().reduce((s,t)=>s+(Number(t.net)||0),0),todayKm=todayTrips().reduce((s,t)=>s+(Number(t.distance)||0),0),monthNet=monthTrips.reduce((s,t)=>s+(Number(t.net)||0),0),monthKm=monthTrips.reduce((s,t)=>s+(Number(t.distance)||0),0),period=p.chartPeriod||'week',periodLabel=period==='week'?'7 дней':period==='month'?'30 дней':'12 месяцев';
  app.innerHTML=`<div class="eyebrow">ЛИЧНЫЙ КАБИНЕТ · VTS DRIVER ID</div><div class="profile-hero"><div class="profile-top"><div class="avatar">${esc(profileName().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('')||'V')}</div><div style="min-width:0;flex:1"><div class="profile-name">${esc(profileName())}</div><div class="profile-meta">${esc(p.position||'Водитель')} · ${esc(p.country||'Страна не указана')}</div><div class="rating-pill">★ ${rate?rate.toFixed(1):'—'} <span style="font-weight:500;opacity:.8">/ 5 · ${rated} оценок</span></div></div><button class="edit-icon" onclick="toggleProfileEdit()">✎</button></div><div class="profile-tags"><span class="profile-tag">▣ ${esc(p.company||'Без компании')}</span><span class="profile-tag">◷ Стаж: ${esc(p.experience||'Не указан')}</span><span class="profile-tag">✓ VTS Driver</span></div><div class="profile-meta" style="margin-top:15px">${esc(p.bio||'Твоя виртуальная карьера дальнобойщика — рейсы, достижения и финансовые результаты в одном месте.')}</div></div>
  <div class="profile-edit" id="profileEdit"><form class="panel" onsubmit="saveProfile(event)"><div class="profile-section-head"><b>Редактирование профиля</b><button class="secondary small-button" type="button" onclick="toggleProfileEdit()">Закрыть</button></div><div class="form-grid"><div><label>Имя</label><input name="firstName" value="${esc(p.firstName||'')}" placeholder="Имя"></div><div><label>Фамилия</label><input name="lastName" value="${esc(p.lastName||'')}" placeholder="Фамилия"></div></div><label>Отображаемое имя</label><input name="name" value="${esc(p.name||'')}" placeholder="Водитель VTS"><label>Транспортная компания</label><input name="company" value="${esc(p.company||'')}"><div class="form-grid"><div><label>Должность</label><input name="position" value="${esc(p.position||'')}"></div><div><label>Водительский стаж</label><input name="experience" value="${esc(p.experience||'')}"></div></div><label>Страна / регион</label><input name="country" value="${esc(p.country||'')}"><label>О себе</label><textarea name="bio" rows="3">${esc(p.bio||'')}</textarea><button class="primary full" type="submit">Сохранить изменения</button></form></div>
  <div class="section-title">Карьерная статистика</div><div class="profile-stats"><div class="stat-tile"><div class="stat-symbol">📦</div><div class="stat-label">Завершено рейсов</div><div class="stat-number">${allTrips}</div><div class="stat-foot">${monthTrips.length} в этом месяце</div></div><div class="stat-tile"><div class="stat-symbol">🛣️</div><div class="stat-label">Общий пробег</div><div class="stat-number">${km.toLocaleString('ru-RU')} км</div><div class="stat-foot">В среднем ${Math.round(avgKm).toLocaleString('ru-RU')} км / рейс</div></div><div class="stat-tile"><div class="stat-symbol">💰</div><div class="stat-label">Чистый доход</div><div class="stat-number">${money(net)}</div><div class="stat-foot">После комиссии</div></div><div class="stat-tile"><div class="stat-symbol">📈</div><div class="stat-label">Средний доход с рейса</div><div class="stat-number">${money(avgNet)}</div><div class="stat-foot">По завершённым рейсам</div></div><div class="stat-tile"><div class="stat-symbol">🧾</div><div class="stat-label">Доход до комиссии</div><div class="stat-number">${money(gross)}</div><div class="stat-foot">Начисления по рейсам</div></div><div class="stat-tile"><div class="stat-symbol">🎯</div><div class="stat-label">Активные заказы</div><div class="stat-number">${data.orders.length}</div><div class="stat-foot">В диспетчерской</div></div><div class="stat-tile"><div class="stat-symbol">📅</div><div class="stat-label">Доход сегодня</div><div class="stat-number">${money(todayNet)}</div><div class="stat-foot">Пробег: ${todayKm.toLocaleString('ru-RU')} км</div></div><div class="stat-tile"><div class="stat-symbol">🗓️</div><div class="stat-label">Доход за месяц</div><div class="stat-number">${money(monthNet)}</div><div class="stat-foot">Пробег: ${monthKm.toLocaleString('ru-RU')} км</div></div><div class="stat-tile"><div class="stat-symbol">⭐</div><div class="stat-label">Рейтинг водителя</div><div class="stat-number">${rate?rate.toFixed(1)+' / 5':'—'}</div><div class="stat-foot">Оценено рейсов: ${rated}</div></div></div>
  <div class="section-title">Аналитика карьеры</div><div class="chart-panel"><div class="chart-head"><div><div class="chart-title">Чистый заработок</div><div class="chart-total">${money(periodSum('money',period))}</div><div class="muted">За период: ${periodLabel}</div></div><span style="font-size:24px">💵</span></div><div class="period-switch"><button class="${period==='week'?'active':''}" onclick="setChartPeriod('week')">7 дней</button><button class="${period==='month'?'active':''}" onclick="setChartPeriod('month')">30 дней</button><button class="${period==='year'?'active':''}" onclick="setChartPeriod('year')">12 мес.</button></div>${renderBars('money',period)}<div class="chart-legend"><span class="legend-dot"></span>Чистый доход по рейсам</div></div>
  <div class="chart-panel"><div class="chart-head"><div><div class="chart-title">Пробег</div><div class="chart-total">${Math.round(periodSum('km',period)).toLocaleString('ru-RU')} км</div><div class="muted">За период: ${periodLabel}</div></div><span style="font-size:24px">🛣️</span></div>${renderBars('km',period)}<div class="chart-legend"><span class="legend-dot"></span>Километры по дате рейса</div></div>
  <div class="section-title">Достижения</div><div class="panel">${achievements().map(a=>`<div class="achievement"><div class="achievement-icon">${a.icon}</div><div style="min-width:0"><div class="achievement-title">${a.title}</div><div class="achievement-sub">${a.sub}</div></div><div class="achievement-state">${a.done?'✓ Получено':'В процессе'}</div></div>`).join('')}</div><div class="section-title">Последние рейсы</div><div class="panel">${profileRecentTrips()}</div><div class="section-title">Резервная копия</div><div class="panel"><button class="secondary full" onclick="exportData()">Экспортировать данные JSON</button><label>Восстановить из JSON-файла</label><input type="file" accept=".json,application/json" onchange="importData(event)"><div class="notice">Данные сохраняются в браузере этого устройства. Профиль и статистика обновляются из записей VTS.</div></div>`;
 }
}
function addTrip(e){e.preventDefault();const f=new FormData(e.target),gross=Number(f.get('gross'))||0,fee=Number(f.get('fee'))||0,net=gross-gross*fee/100,t={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),from:f.get('from'),to:f.get('to'),date:f.get('date'),distance:Number(f.get('distance')),cargo:f.get('cargo'),gross,fee,net};data.trips.push(t);if(f.get('credit')){data.balance+=net;data.transactions.push({id:String(Date.now()),title:'Доход за рейс: '+t.from+' — '+t.to,date:t.date,amount:net})}saveData();showPage('trips')}
function deleteTrip(id){if(!confirm('Удалить этот рейс?'))return;data.trips=data.trips.filter(t=>String(t.id)!==String(id));saveData();render()}
function addOrder(e){e.preventDefault();const f=new FormData(e.target);data.orders.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),from:f.get('from'),to:f.get('to'),date:f.get('date'),cargo:f.get('cargo'),distance:Number(f.get('distance')),pay:Number(f.get('pay'))});saveData();showPage('orders')}
function deleteOrder(id){if(!confirm('Отменить этот заказ?'))return;data.orders=data.orders.filter(o=>String(o.id)!==String(id));saveData();render()}
function completeOrder(id){const o=data.orders.find(x=>String(x.id)===String(id));if(!o)return;if(!confirm('Перенести заказ в историю рейсов? Комиссия составит 10%.'))return;const gross=Number(o.pay)||0,fee=10,net=gross-gross*fee/100;data.trips.push({...o,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),gross,fee,net});data.orders=data.orders.filter(x=>String(x.id)!==String(id));data.balance+=net;data.transactions.push({id:String(Date.now()),title:'Доход за заказ: '+o.from+' — '+o.to,date:o.date,amount:net});saveData();showPage('trips')}
function deposit(e){e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount'));if(amount<=0)return;data.balance+=amount;data.transactions.push({id:String(Date.now()),title:f.get('title')||'Пополнение виртуального счёта',date:todayKey(),amount});saveData();render()}
function toggleProfileEdit(){const el=document.getElementById('profileEdit');if(el)el.classList.toggle('open')}
function saveProfile(e){e.preventDefault();const f=new FormData(e.target);data.profile={...data.profile,firstName:String(f.get('firstName')||'').trim(),lastName:String(f.get('lastName')||'').trim(),name:String(f.get('name')||'').trim(),company:String(f.get('company')||'').trim(),position:String(f.get('position')||'').trim(),experience:String(f.get('experience')||'').trim(),country:String(f.get('country')||'').trim(),bio:String(f.get('bio')||'').trim()};saveData();render()}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='VTS-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x.profile||!Array.isArray(x.trips)||!Array.isArray(x.orders)||!Array.isArray(x.transactions))throw Error();if(!confirm('Заменить текущие данные резервной копией?'))return;data=x;saveData();showPage('profile');alert('Данные восстановлены.')}catch(err){alert('Не удалось прочитать резервную копию VTS.')}};reader.readAsText(file)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleMenu(false)});
render();
</script>
