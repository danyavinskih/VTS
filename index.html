<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b111a">
<title>VTS — Virtual Trucking System</title>
<style>
:root{--bg:#0b111a;--panel:#131d2a;--panel2:#192638;--blue:#438cff;--text:#f0f5ff;--muted:#91a2ba;--border:#26364a;--green:#42d6a0;--gold:#f5c96a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:30px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{padding:15px 16px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,17,26,.96);backdrop-filter:blur(16px);z-index:15}
.menu-button{width:44px;height:44px;border:1px solid var(--border);border-radius:13px;background:var(--panel);color:var(--text);font-size:24px;display:grid;place-items:center;flex-shrink:0}
.logo{font-size:25px;font-weight:850;letter-spacing:2px}
.logo span{color:var(--blue)}
.subtitle{font-size:10px;color:var(--muted);letter-spacing:1.2px;margin-top:3px}
.status{font-size:10px;color:var(--green);background:#12332d;padding:7px 9px;border-radius:20px;margin-left:auto;white-space:nowrap}
main{max-width:850px;margin:auto;padding:22px 16px}
.eyebrow{color:var(--blue);font-size:11px;font-weight:700;letter-spacing:1.5px}
h1{font-size:28px;margin:8px 0 7px}
.description{color:var(--muted);font-size:14px;line-height:1.55}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:18px 0}
.card{background:linear-gradient(145deg,#162437,#121c29);border:1px solid var(--border);border-radius:17px;padding:15px;min-width:0}
.card-label{font-size:12px;color:var(--muted)}
.card-value{font-size:22px;font-weight:750;margin-top:10px;overflow-wrap:anywhere}
.card-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#1e3552;color:#8fc0ff;margin-bottom:13px}
.section-title{font-size:17px;font-weight:750;margin:25px 0 12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.muted{color:var(--muted);font-size:13px}
.primary,.secondary,.danger{border:0;border-radius:11px;padding:12px 15px;font-weight:650}
.primary{background:var(--blue);color:white}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.danger{background:#48212a;color:#ffb5c0}
.full{width:100%;margin-top:12px}
input,select,textarea{width:100%;background:#0d1622;border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;margin-top:6px}
label{display:block;font-size:13px;color:var(--muted);margin-top:14px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{padding:13px 0;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item-title{font-weight:650}
.item-sub{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5}
.empty{text-align:center;color:var(--muted);padding:23px 8px;font-size:13px;line-height:1.6}
.small-button{font-size:11px;padding:7px 9px}
.notice{color:var(--muted);font-size:12px;line-height:1.5;margin-top:12px}
.icon{width:21px;height:21px;display:inline-block;vertical-align:middle;flex-shrink:0}
.news-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:0}
.news-icon{width:38px;height:38px;display:grid;place-items:center;background:#1d3048;border-radius:12px;color:#82b7ff;flex-shrink:0}
.news-text{font-size:13px;line-height:1.5}
.news-time{font-size:11px;color:var(--muted);margin-top:4px}
.order-route{display:flex;gap:10px;align-items:center;margin:16px 0}
.route-dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px #203754;flex-shrink:0}
.route-line{height:26px;border-left:1px dashed #4c6381;margin:5px 0 5px 4px}
.route-info{min-width:0}
.route-city{font-weight:700;overflow-wrap:anywhere}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:30;opacity:0;visibility:hidden;transition:.22s}
.overlay.open{opacity:1;visibility:visible}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(82vw,320px);background:#101a28;border-right:1px solid var(--border);z-index:31;transform:translateX(-102%);transition:transform .24s ease;padding:20px 15px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.drawer.open{transform:translateX(0)}
.drawer-top{display:flex;align-items:center;justify-content:space-between;padding:5px 2px 18px;border-bottom:1px solid var(--border);margin-bottom:8px}
.close-menu{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:10px;width:38px;height:38px;font-size:22px}
.drawer-link{display:flex;align-items:center;gap:13px;border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:13px;border-radius:12px;font-weight:600}
.drawer-link.active{background:#172b45;border-color:#294466;color:#8fc0ff}
.drawer-link .icon{width:22px;height:22px}
.drawer-footer{margin-top:auto;border-top:1px solid var(--border);padding:14px 5px 0;color:var(--muted);font-size:11px;line-height:1.6}
.profile-hero{position:relative;overflow:hidden;background:radial-gradient(circle at 90% 10%,#244b79 0,transparent 38%),linear-gradient(145deg,#172b43,#101a28);border:1px solid #2a4565;border-radius:22px;padding:22px;margin-top:16px}
.profile-hero:after{content:"VTS";position:absolute;right:8px;bottom:-25px;font-size:100px;font-weight:900;letter-spacing:-7px;color:rgba(150,190,240,.055);pointer-events:none}
.profile-top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.avatar{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#3b82d9,#24446b);font-size:25px;font-weight:850;box-shadow:0 8px 25px #07101d80;flex-shrink:0}
.profile-name{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.profile-meta{font-size:12px;color:#a9bfd9;margin-top:5px}
.rating-pill{display:inline-flex;align-items:center;gap:5px;background:#332c1b;border:1px solid #5b4b2a;color:#ffd36b;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:750;margin-top:9px}
.edit-icon{margin-left:auto;width:42px;height:42px;border-radius:13px;background:#203650;border:1px solid #355575;color:#dcecff;font-size:18px;flex-shrink:0}
.profile-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:1}
.profile-tag{border:1px solid #334a63;background:#132338;color:#d4e4f8;border-radius:9px;padding:7px 9px;font-size:11px}
.profile-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:13px 0}
.stat-tile{background:linear-gradient(145deg,#172638,#111b28);border:1px solid var(--border);border-radius:16px;padding:14px;min-width:0}
.stat-symbol{font-size:19px;margin-bottom:9px}
.stat-number{font-size:20px;font-weight:800;overflow-wrap:anywhere;margin-top:5px}
.stat-label{font-size:11px;color:var(--muted);line-height:1.4}
.stat-foot{font-size:10px;color:#8fa6c0;margin-top:7px}
.chart-panel{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:15px;margin-top:12px}
.chart-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chart-title{font-size:14px;font-weight:750}
.chart-total{font-size:20px;font-weight:800;margin-top:7px}
.period-switch{display:flex;gap:4px;background:#0d1622;padding:4px;border-radius:10px;border:1px solid var(--border);margin-top:14px}
.period-switch button{flex:1;border:0;border-radius:7px;background:transparent;color:var(--muted);padding:8px 5px;font-size:11px}
.period-switch button.active{background:#244a78;color:white}
.bar-chart{height:145px;display:flex;align-items:stretch;gap:8px;padding-top:17px;border-bottom:1px solid #34465c;margin-top:10px}
.bar-col{display:flex;flex:1;min-width:0;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}
.bar-value{font-size:9px;color:#a8bed7;white-space:nowrap;max-width:100%;overflow:hidden}
.bar-track{height:100px;width:min(100%,25px);display:flex;align-items:flex-end;justify-content:center}
.bar-fill{width:100%;min-height:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#69b2ff,#3479d4);box-shadow:0 0 15px #3987ed22}
.bar-label{font-size:10px;color:var(--muted);margin-bottom:-19px;transform:translateY(21px)}
.chart-legend{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-top:29px}
.legend-dot{width:8px;height:8px;background:#4d9af5;border-radius:50%}
.profile-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.achievement{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--border)}
.achievement:last-child{border-bottom:0}
.achievement-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#20354d;font-size:19px;flex-shrink:0}
.achievement-title{font-size:13px;font-weight:700}
.achievement-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
.achievement-state{margin-left:auto;color:var(--green);font-size:10px;white-space:nowrap}
.rating-stars{display:flex;gap:8px;margin-top:10px}
.rating-stars button{border:1px solid var(--border);background:#101a28;color:#53647a;border-radius:10px;font-size:25px;flex:1;padding:7px 2px}
.rating-stars button.selected{color:#ffd36b;background:#332c1b;border-color:#715d31}
.profile-edit{display:none;margin-top:12px}
.profile-edit.open{display:block}
.profile-edit .panel{border-color:#355579}
.recent-trip{padding:12px 0;border-bottom:1px solid var(--border)}
.recent-trip:last-child{border-bottom:0}
@media(min-width:600px){.profile-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.bar-chart{height:175px}.bar-track{height:125px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}main{padding-top:30px}.card-value{font-size:21px}}
@media(max-width:360px){.status{display:none}.form-grid{grid-template-columns:1fr}.card-value{font-size:20px}}
</style>
</head>
<body>
<header>
<button class="menu-button" aria-label="Открыть меню" onclick="toggleMenu(true)">☰</button>
<div><div class="logo">V<span>T</span>S</div><div class="subtitle">VIRTUAL TRUCKING SYSTEM · ETS2</div></div>
<div class="status">● Система готова</div>
</header>
<div class="overlay" id="overlay" onclick="toggleMenu(false)"></div>
<aside class="drawer" id="drawer" aria-label="Главное меню">
<div class="drawer-top"><div><div class="logo">V<span>T</span>S</div><div class="subtitle">ГЛАВНОЕ МЕНЮ</div></div><button class="close-menu" aria-label="Закрыть меню" onclick="toggleMenu(false)">×</button></div>
<button class="drawer-link active" data-page="home" onclick="showPage('home')">⌂　Главная</button>
<button class="drawer-link" data-page="trips" onclick="showPage('trips')">☷　Рейсы</button>
<button class="drawer-link" data-page="orders" onclick="showPage('orders')">▤　Заказы</button>
<button class="drawer-link" data-page="bank" onclick="showPage('bank')">▣　Банк</button>
<button class="drawer-link" data-page="profile" onclick="showPage('profile')">♙　Профиль</button>
<div class="drawer-footer">VTS · Virtual Trucking System<br>Учёт виртуальной карьеры ETS2</div>
</aside>
<main id="app"></main>
<script>
const KEY = "vts_data_v1";

const defaults = {
  profile: {
    firstName: "Данил",
    lastName: "Водитель",
    nickname: "VTS_Driver",
    company: "VTS Logistics",
    city: "Москва",
    level: 1,
    rating: 5
  },
  trips: [],
  orders: [
    {
      id: 1001,
      from: "Берлин",
      to: "Прага",
      cargo: "Продукты питания",
      distance: 350,
      payment: 42000,
      status: "Доступен"
    },
    {
      id: 1002,
      from: "Мюнхен",
      to: "Вена",
      cargo: "Электроника",
      distance: 435,
      payment: 57000,
      status: "Доступен"
    }
  ],
  transactions: [],
  ratings: [],
  settings: {
    currency: "₽"
  }
};

function loadData() {
  try {
    const saved = localStorage.getItem(KEY);
    if (!saved) return structuredClone(defaults);
    const data = JSON.parse(saved);
    return {
      ...structuredClone(defaults),
      ...data,
      profile: {...defaults.profile, ...data.profile},
      settings: {...defaults.settings, ...data.settings},
      trips: Array.isArray(data.trips) ? data.trips : [],
      orders: Array.isArray(data.orders) ? data.orders : [],
      transactions: Array.isArray(data.transactions) ? data.transactions : [],
      ratings: Array.isArray(data.ratings) ? data.ratings : []
    };
  } catch (error) {
    console.error("Ошибка загрузки VTS:", error);
    return structuredClone(defaults);
  }
}

let db = loadData();
let currentPage = "home";

function saveData() {
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
  } catch (error) {
    alert("Не удалось сохранить данные. Проверьте свободное место браузера.");
  }
}

function money(value) {
  return new Intl.NumberFormat("ru-RU", {
    maximumFractionDigits: 0
  }).format(Number(value) || 0) + " ₽";
}

function number(value) {
  return new Intl.NumberFormat("ru-RU", {
    maximumFractionDigits: 1
  }).format(Number(value) || 0);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function totalDistance() {
  return db.trips.reduce((sum, trip) => sum + Number(trip.distance || 0), 0);
}

function totalIncome() {
  return db.trips.reduce((sum, trip) => sum + Number(trip.payment || 0), 0);
}

function totalExpenses() {
  return db.transactions
    .filter(item => item.type === "expense")
    .reduce((sum, item) => sum + Number(item.amount || 0), 0);
}

function balance() {
  const income = db.transactions
    .filter(item => item.type === "income")
    .reduce((sum, item) => sum + Number(item.amount || 0), 0);

  return income + totalIncome() - totalExpenses();
}

function toggleMenu(open) {
  document.getElementById("drawer").classList.toggle("open", open);
  document.getElementById("overlay").classList.toggle("open", open);
}

function showPage(page) {
  currentPage = page;
  toggleMenu(false);

  document.querySelectorAll(".drawer-link").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });

  render();
  window.scrollTo({top: 0, behavior: "smooth"});
}

function pageHeader(label, title, description) {
  return `
    <div class="eyebrow">${escapeHTML(label)}</div>
    <h1>${escapeHTML(title)}</h1>
    <div class="description">${escapeHTML(description)}</div>
  `;
}

function card(label, value, icon) {
  return `
    <div class="card">
      <div class="card-icon">${icon}</div>
      <div class="card-label">${escapeHTML(label)}</div>
      <div class="card-value">${escapeHTML(value)}</div>
    </div>
  `;
}

function renderHome() {
  const recent = [...db.trips].slice(-3).reverse();

  return `
    ${pageHeader("VIRTUAL TRUCKING SYSTEM", "Твоя карьера", "Управляй виртуальной карьерой дальнобойщика в ETS2.")}

    <div class="cards">
      ${card("Всего рейсов", number(db.trips.length), "🚛")}
      ${card("Общий пробег", number(totalDistance()) + " км", "🛣️")}
      ${card("Заработано", money(totalIncome()), "💰")}
      ${card("Баланс", money(balance()), "🏦")}
    </div>

    <div class="section-title">Быстрые действия</div>
    <div class="panel">
      <button class="primary full" onclick="showPage('trips')">＋ Добавить рейс</button>
      <button class="secondary full" onclick="showPage('orders')">Открыть диспетчерскую</button>
      <button class="secondary full" onclick="showPage('profile')">Профиль водителя</button>
    </div>

    <div class="section-title">Последние рейсы</div>
    <div class="panel">
      ${recent.length ? recent.map(trip => `
        <div class="item">
          <div class="row">
            <div class="item-title">${escapeHTML(trip.from)} → ${escapeHTML(trip.to)}</div>
            <strong>${money(trip.payment)}</strong>
          </div>
          <div class="item-sub">${number(trip.distance)} км · ${escapeHTML(trip.cargo)} · ${escapeHTML(trip.date)}</div>
        </div>
      `).join("") : '<div class="empty">Рейсов пока нет.<br>Добавь первый рейс, чтобы начать статистику.</div>'}
    </div>

    <div class="section-title">Новости VTS</div>
    <div class="panel">
      <div class="news-item">
        <div class="news-icon">🚛</div>
        <div class="news-text"><strong>Добро пожаловать в VTS</strong><div class="news-time">Система учёта карьеры</div>Записывай рейсы, следи за финансами и развивай профиль водителя.</div>
      </div>
      <div class="news-item">
        <div class="news-icon">📊</div>
        <div class="news-text"><strong>Статистика карьеры</strong><div class="news-time">Совет водителю</div>Регулярно добавляй завершённые рейсы, чтобы видеть свой прогресс.</div>
      </div>
    </div>
  `;
}

function renderTrips() {
  const trips = [...db.trips].reverse();

  return `
    ${pageHeader("ЖУРНАЛ ВОДИТЕЛЯ", "История рейсов", "Добавляй завершённые перевозки вручную.")}

    <div class="cards">
      ${card("Рейсов", number(db.trips.length), "🚚")}
      ${card("Пробег", number(totalDistance()) + " км", "🛣️")}
    </div>

    <div class="section-title">Новый рейс</div>
    <form class="panel" onsubmit="addTrip(event)">
      <div class="form-grid">
        <div><label>Откуда<input name="from" required placeholder="Берлин"></label></div>
        <div><label>Куда<input name="to" required placeholder="Прага"></label></div>
        <div><label>Груз<input name="cargo" required placeholder="Электроника"></label></div>
        <div><label>Дата<input name="date" type="date" required></label></div>
        <div><label>Расстояние, км<input name="distance" type="number" min="1" required></label></div>
        <div><label>Оплата, ₽<input name="payment" type="number" min="0" required></label></div>
      </div>
      <button class="primary full" type="submit">Сохранить рейс</button>
    </form>

    <div class="section-title">Все рейсы · ${trips.length}</div>
    <div class="panel">
      ${trips.length ? trips.map(trip => `
        <div class="item">
          <div class="row">
            <div class="item-title">${escapeHTML(trip.from)} → ${escapeHTML(trip.to)}</div>
            <strong>${money(trip.payment)}</strong>
          </div>
          <div class="item-sub">${escapeHTML(trip.date)} · ${number(trip.distance)} км · ${escapeHTML(trip.cargo)}</div>
          <button class="danger small-button" style="margin-top:9px" onclick="deleteTrip(${Number(trip.id)})">Удалить</button>
        </div>
      `).join("") : '<div class="empty">История пока пуста.</div>'}
    </div>
  `;
}

function addTrip(event) {
  event.preventDefault();
  const form = new FormData(event.target);

  const trip = {
    id: Date.now(),
    from: form.get("from").trim(),
    to: form.get("to").trim(),
    cargo: form.get("cargo").trim(),
    date: form.get("date"),
    distance: Number(form.get("distance")),
    payment: Number(form.get("payment"))
  };

  if (!trip.from || !trip.to || trip.distance <= 0 || trip.payment < 0) {
    alert("Проверь введённые данные.");
    return;
  }

  db.trips.push(trip);
  saveData();
  render();
  alert("Рейс добавлен в историю!");
}

function deleteTrip(id) {
  if (!confirm("Удалить этот рейс?")) return;
  db.trips = db.trips.filter(trip => Number(trip.id) !== id);
  saveData();
  render();
}

function renderOrders() {
  return `
    ${pageHeader("VTS DISPATCH", "Диспетчерская", "Выбирай заказы для своей виртуальной карьеры.")}
    <div class="cards">
      ${card("Доступно", number(db.orders.filter(o => o.status === "Доступен").length), "📦")}
      ${card("Выполнено", number(db.orders.filter(o => o.status === "Выполнен").length), "✓")}
    </div>
    <div class="section-title">Доступные заказы</div>
    <div class="panel">
      ${db.orders.length ? db.orders.map(o => `
        <div class="item">
          <div class="row">
            <div class="item-title">${escapeHTML(o.from)} → ${escapeHTML(o.to)}</div>
            <strong>${money(o.payment)}</strong>
          </div>
          <div class="item-sub">${escapeHTML(o.cargo)} · ${number(o.distance)} км · ${escapeHTML(o.status)}</div>
          ${o.status === "Доступен" ? `<button class="primary small-button" style="margin-top:9px" onclick="acceptOrder(${Number(o.id)})">Принять заказ</button>` : ""}
        </div>
      `).join("") : '<div class="empty">Заказов пока нет.</div>'}
    </div>
    <div class="section-title">Создать заказ</div>
    <form class="panel" onsubmit="addOrder(event)">
      <label>Откуда<input name="from" required placeholder="Гамбург"></label>
      <label>Куда<input name="to" required placeholder="Амстердам"></label>
      <label>Груз<input name="cargo" required placeholder="Промышленные товары"></label>
      <div class="form-grid">
        <div><label>Километры<input name="distance" type="number" min="1" required></label></div>
        <div><label>Оплата, ₽<input name="payment" type="number" min="0" required></label></div>
      </div>
      <button class="primary full" type="submit">Добавить заказ</button>
    </form>
  `;
}

function addOrder(event) {
  event.preventDefault();
  const f = new FormData(event.target);
  db.orders.push({
    id: Date.now(),
    from: f.get("from").trim(),
    to: f.get("to").trim(),
    cargo: f.get("cargo").trim(),
    distance: Number(f.get("distance")),
    payment: Number(f.get("payment")),
    status: "Доступен"
  });
  saveData();
  render();
  alert("Заказ добавлен!");
}

function acceptOrder(id) {
  const order = db.orders.find(o => Number(o.id) === id);
  if (!order || order.status !== "Доступен") return;
  if (!confirm(`Принять заказ ${order.from} → ${order.to}?`)) return;
  order.status = "Выполнен";
  db.trips.push({
    id: Date.now(),
    from: order.from,
    to: order.to,
    cargo: order.cargo,
    distance: order.distance,
    payment: order.payment,
    date: new Date().toISOString().slice(0, 10)
  });
  saveData();
  render();
  alert("Заказ выполнен и добавлен в историю рейсов.");
}

function renderBank() {
  return `
    ${pageHeader("ФИНАНСЫ", "Банк водителя", "Веди учёт виртуальных доходов и расходов.")}
    <div class="cards">
      ${card("Текущий баланс", money(balance()), "🏦")}
      ${card("Доходы рейсов", money(totalIncome()), "💰")}
      ${card("Расходы", money(totalExpenses()), "💸")}
    </div>
    <div class="section-title">Финансовая операция</div>
    <form class="panel" onsubmit="addTransaction(event)">
      <label>Тип операции
        <select name="type">
          <option value="income">Дополнительный доход</option>
          <option value="expense">Расход</option>
        </select>
      </label>
      <label>Описание<input name="description" required placeholder="Заправка, ремонт, премия"></label>
      <label>Сумма, ₽<input name="amount" type="number" min="1" required></label>
      <button class="primary full" type="submit">Сохранить операцию</button>
    </form>
    <div class="section-title">История операций</div>
    <div class="panel">
      ${db.transactions.length ? [...db.transactions].reverse().map(t => `
        <div class="item row">
          <div><div class="item-title">${escapeHTML(t.description)}</div><div class="item-sub">${escapeHTML(t.date)} · ${t.type === "expense" ? "Расход" : "Доход"}</div></div>
          <strong style="color:${t.type === "expense" ? "#ff9eaa" : "#42d6a0"}">${t.type === "expense" ? "−" : "+"}${money(t.amount)}</strong>
        </div>
      `).join("") : '<div class="empty">Операций пока нет.</div>'}
    </div>
  `;
}

function addTransaction(event) {
  event.preventDefault();
  const f = new FormData(event.target);
  db.transactions.push({
    id: Date.now(),
    type: f.get("type"),
    description: f.get("description").trim(),
    amount: Number(f.get("amount")),
    date: new Date().toISOString().slice(0, 10)
  });
  saveData();
  render();
  alert("Операция сохранена.");
}

function renderProfile() {
  const p = db.profile;
  const name = [p.firstName, p.lastName].filter(Boolean).join(" ") || "Водитель VTS";

  return `
    ${pageHeader("ЛИЧНОЕ ДЕЛО", "Профиль водителя", "Твои данные и достижения виртуальной карьеры.")}
    <div class="profile-hero">
      <div class="profile-top">
        <div class="avatar">${escapeHTML((p.firstName || "V").slice(0, 1).toUpperCase())}</div>
        <div>
          <div class="profile-name">${escapeHTML(name)}</div>
          <div class="profile-meta">@${escapeHTML(p.nickname)} · ${escapeHTML(p.company)}</div>
          <div class="rating-pill">★ ${number(p.rating)} / 5</div>
        </div>
        <button class="edit-icon" onclick="toggleProfileEdit()" aria-label="Редактировать профиль">✎</button>
      </div>
      <div class="profile-tags">
        <span class="profile-tag">Уровень ${number(p.level)}</span>
        <span class="profile-tag">🚛 Водитель ETS2</span>
        <span class="profile-tag">📍 ${escapeHTML(p.city)}</span>
      </div>
    </div>
    <div class="profile-edit" id="profileEdit">
      <form class="panel" onsubmit="saveProfile(event)">
        <div class="form-grid">
          <div><label>Имя<input name="firstName" value="${escapeHTML(p.firstName)}" required></label></div>
          <div><label>Фамилия<input name="lastName" value="${escapeHTML(p.lastName)}" required></label></div>
          <div><label>Никнейм<input name="nickname" value="${escapeHTML(p.nickname)}" required></label></div>
          <div><label>Компания<input name="company" value="${escapeHTML(p.company)}" required></label></div>
          <div><label>Город<input name="city" value="${escapeHTML(p.city)}" required></label></div>
          <div><label>Уровень<input name="level" type="number" min="1" value="${Number(p.level) || 1}"></label></div>
        </div>
        <button class="primary full" type="submit">Сохранить профиль</button>
      </form>
    </div>
    <div class="profile-stats">
      <div class="stat-tile"><div class="stat-symbol">🚚</div><div class="stat-label">Завершено рейсов</div><div class="stat-number">${number(db.trips.length)}</div></div>
      <div class="stat-tile"><div class="stat-symbol">🛣️</div><div class="stat-label">Общий пробег</div><div class="stat-number">${number(totalDistance())} км</div></div>
      <div class="stat-tile"><div class="stat-symbol">💰</div><div class="stat-label">Доход с рейсов</div><div class="stat-number">${money(totalIncome())}</div></div>
    </div>
    <div class="section-title">Достижения</div>
    <div class="panel">
      ${[
        ["🚛", "Первый рейс", "Заверши первую перевозку.", db.trips.length >= 1],
        ["🛣️", "Первые 1 000 км", "Накопи 1 000 км пробега.", totalDistance() >= 1000],
        ["💰", "Первый заработок", "Заработай на перевозках.", totalIncome() > 0],
        ["🏆", "Десять рейсов", "Заверши десять перевозок.", db.trips.length >= 10]
      ].map(a => `
        <div class="achievement">
          <div class="achievement-icon">${a[0]}</div>
          <div><div class="achievement-title">${a[1]}</div><div class="achievement-sub">${a[2]}</div></div>
          <div class="achievement-state">${a[3] ? "Получено ✓" : "Закрыто"}</div>
        </div>
      `).join("")}
    </div>
    <div class="section-title">Резервная копия</div>
    <div class="panel">
      <button class="primary full" onclick="exportData()">Экспортировать данные JSON</button>
      <label>Импортировать резервную копию<input type="file" accept=".json,application/json" onchange="importData(event)"></label>
      <button class="danger full" onclick="resetData()">Сбросить все данные</button>
      <div class="notice">Данные хранятся локально в браузере на этом устройстве. Экспортируй копию, чтобы не потерять историю.</div>
    </div>
  `;
}

function toggleProfileEdit() {
  document.getElementById("profileEdit")?.classList.toggle("open");
}

function saveProfile(event) {
  event.preventDefault();
  const f = new FormData(event.target);
  db.profile = {
    ...db.profile,
    firstName: f.get("firstName").trim(),
    lastName: f.get("lastName").trim(),
    nickname: f.get("nickname").trim(),
    company: f.get("company").trim(),
    city: f.get("city").trim(),
    level: Math.max(1, Number(f.get("level")) || 1)
  };
  saveData();
  render();
  alert("Профиль обновлён.");
}

function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "VTS_backup.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!imported || !imported.profile || !Array.isArray(imported.trips)) {
        throw new Error("Неподходящий формат файла");
      }

      if (!confirm("Заменить текущие данные данными из резервной копии?")) return;

      db = {
        ...structuredClone(defaults),
        ...imported,
        profile: {...defaults.profile, ...imported.profile},
        settings: {...defaults.settings, ...imported.settings},
        trips: Array.isArray(imported.trips) ? imported.trips : [],
        orders: Array.isArray(imported.orders) ? imported.orders : [],
        transactions: Array.isArray(imported.transactions) ? imported.transactions : [],
        ratings: Array.isArray(imported.ratings) ? imported.ratings : []
      };

      saveData();
      render();
      alert("Резервная копия восстановлена.");
    } catch (error) {
      alert("Не удалось прочитать JSON-файл. Проверь резервную копию.");
    }
  };
  reader.readAsText(file);
}

function resetData() {
  if (!confirm("Удалить всю историю рейсов, заказы и операции? Сначала сделай резервную копию.")) return;
  if (!confirm("Подтверди сброс данных VTS.")) return;
  db = structuredClone(defaults);
  saveData();
  render();
}

function render() {
  const app = document.getElementById("app");
  const pages = {
    home: renderHome,
    trips: renderTrips,
    orders: renderOrders,
    bank: renderBank,
    profile: renderProfile
  };
  app.innerHTML = (pages[currentPage] || renderHome)();
}

render();
</script>
</body>
</html>
