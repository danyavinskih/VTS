<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTS — Профиль водителя</title>
<style>
:root {
  --bg: #0b1120;
  --panel: #131d30;
  --panel2: #19263b;
  --border: #263750;
  --blue: #3987ff;
  --text: #f1f5fb;
  --muted: #93a4bd;
  --green: #35d39a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.container { max-width: 850px; margin: auto; }
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.logo { font-weight: 900; font-size: 25px; letter-spacing: 2px; }
.logo span { color: var(--blue); }
.badge {
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--muted);
  font-size: 11px;
}
h1 { font-size: 27px; margin: 0 0 7px; }
.subtitle { color: var(--muted); margin-bottom: 22px; font-size: 14px; }
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 19px;
  margin-bottom: 16px;
}
.hero { display: flex; align-items: center; gap: 15px; }
.avatar {
  width: 66px; height: 66px; flex-shrink: 0;
  display: grid; place-items: center;
  background: linear-gradient(135deg,#3987ff,#1748a1);
  border-radius: 18px; font-size: 24px; font-weight: 800;
}
.name { font-size: 22px; font-weight: 800; }
.meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
.rating { color: #ffd166; margin-top: 8px; font-size: 13px; }
.section-title { font-size: 16px; font-weight: 750; margin-bottom: 15px; }
.grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
}
.stat {
  background: var(--panel2);
  border: 1px solid var(--border);
  padding: 15px;
  border-radius: 13px;
  min-width: 0;
}
.stat-label { color: var(--muted); font-size: 12px; }
.stat-value { font-size: 21px; font-weight: 800; margin-top: 8px; overflow-wrap: anywhere; }
.stat-note { color: var(--green); font-size: 11px; margin-top: 6px; }
label { display: block; color: var(--muted); font-size: 12px; margin: 13px 0 6px; }
input, textarea, select {
  width: 100%; padding: 12px;
  color: var(--text); background: #0b1424;
  border: 1px solid var(--border); border-radius: 10px;
  font: inherit; outline: none;
}
input:focus, textarea:focus { border-color: var(--blue); }
textarea { resize: vertical; }
button {
  padding: 11px 14px; border: 0; border-radius: 10px;
  background: var(--blue); color: white;
  font-weight: 700; cursor: pointer; margin-top: 12px;
}
button.secondary { background: var(--panel2); border: 1px solid var(--border); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions button { flex: 1; }
.achievement {
  display: flex; gap: 12px; align-items: center;
  padding: 13px 0; border-bottom: 1px solid var(--border);
}
.achievement:last-child { border-bottom: 0; padding-bottom: 0; }
.medal {
  width: 42px; height: 42px; display: grid; place-items: center;
  border-radius: 12px; background: #243753; font-size: 20px;
}
.achievement-title { font-weight: 700; font-size: 14px; }
.achievement-desc { color: var(--muted); font-size: 12px; margin-top: 4px; }
.notice { color: var(--muted); font-size: 12px; line-height: 1.6; }
#message { color: var(--green); font-size: 13px; margin-top: 10px; }
