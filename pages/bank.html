0deg,#0c2b4b,#061426);border-radius:18px;padding:20px;margin:16px 0}.loan-total{font-size:30px;font-weight:850;color:#7bd2ff;margin:8px 0}.loan-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.loan-metric{padding:14px;border:1px solid #173c5e;background:#07182b;border-radius:13px}.loan-metric small{display:block;color:#8aa8c6;margin-bottom:7px}.loan-metric strong{font-size:17px}.loan-progress{display:flex;gap:5px;margin:16px 0 22px}.loan-progress span{height:5px;flex:1;border-radius:5px;background:#16324d}.loan-progress span.on{background:linear-gradient(90deg,#087df5,#36c2ff)}.loan-list-item{padding:18px;border:1px solid #1b4b72;border-radius:17px;background:#081b30;margin:12px 0}.loan-list-item h3{margin:0 0 7px}.loan-status{font-size:11px;letter-spacing:1px;color:#63d9a8;font-weight:800}.loan-empty{padding:24px;text-align:center;color:#91abc6;border:1px dashed #255074;border-radius:16px}.transfer-hero{padding:22px;border-radius:20px;border:1px solid #1a5a8c;background:radial-gradient(ellipse at 100% 0,#124a7c 0,transparent 44%),linear-gradient(135deg,#0b2847,#061426);margin-bottom:18px}.transfer-hero h1{margin:8px 0}.transfer-methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.transfer-choice{padding:17px;border-radius:15px;border:1px solid #1b4c74;background:#081a2d;text-align:left}.transfer-choice.active{border-color:#35baff;background:#0c2b49;box-shadow:inset 0 0 0 1px #35baff55}.transfer-choice strong{display:block;margin:8px 0}.transfer-choice small{color:#91b0ce}.receipt-success{text-align:center;padding:24px 0 10px}.receipt-success .check{margin:0 auto 16px;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#103e33;border:1px solid #2ecb95;color:#67edbd;font-size:38px;box-shadow:0 0 35px #1bc78a20}.receipt-success h2{margin:7px 0}.receipt-success .receipt-amount{font-size:32px;font-weight:850;color:#7bd2ff;margin:15px 0}.loan-day-note{font-size:12px;line-height:1.5;color: <body><div class="app"><header class="top"><div class="brand">VTS <span>BANK</span></div><div class="top-actions"><button class="user" id="userName" onclick="editHolder()">👤 Владелец ▾</button><button class="exit-bank" onclick="exitBank()">← Выйти в VTS</button></div></header><div class="layout"><aside class="sidebar"><button class="nav active" data-page="home">⌂ <span>Главная</span></button><button class="nav" data-page="cards">▣ <span>Мои карты</span></button><button class="nav" data-page="transfer">⇄ <span>Переводы</span></button><button class="nav" data-page="payment">▤ <span>Платежи</span></button><button class="nav" data-page="loans">₽ <span>Кредиты</span></button><button class="nav" data-page="history">◷ <span>История</span></button><button class="nav" data-page="settings">⚙ <span>Настройки</span></button></aside><main class="content" id="content"></main></div></div><div id="toast" class="toast hidden"></div>
<script>
const STORE='vts_bank_ui_v1', DATA_KEY='vts_data_v1', PROFILE_KEY='vts_profile_v1';let data=readData();let state=load();let page='home',selected=0,flipped=false;let fuelStep=1,fuelPump=1,fuelAmount='0';let serviceStep=1,serviceTruck='',serviceItems=[];let loanStep=1,loanKind='truck',loanAmount='2500000',loanDown='0',loanDays=180,loanDraft=null;let transferStep=1,transferMethod='phone',transferDraft=null;const SERVICE_CATALOG=[{id:'full',name:'Капитальный ремонт грузовика',desc:'Комплексный ремонт основных узлов',price:85000},{id:'engine',name:'Ремонт двигателя',desc:'Повреждения двигателя и его компонентов',price:35000},{id:'transmission',name:'Ремонт коробки передач',desc:'Коробка передач и трансмиссия',price:24000},{id:'wheels',name:'Замена шин и ремонт колёс',desc:'Изношенные или повреждённые шины',price:18000},{id:'chassis',name:'Ремонт шасси',desc:'Рама, подвеска и ходовая часть',price:16000},{id:'cabin',name:'Ремонт кабины',desc:'Повреждения кабины грузовика',price:12000},{id:'trailer',name:'Ремонт прицепа',desc:'Повреждения прицепа или полуприцепа',price:22000},{id:'paint',name:'Покраска грузовика',desc:'Обновление внешнего вида',price:15000}];
function readData(){try{return JSON.parse(localStorage.getItem(DATA_KEY)||'{}')||{}}catch(e){return {}}}
function load(){let x={};try{x=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch(e){};let p={...(data.profile||{})};try{p={...p,...(JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')||{})}}catch(e){};let holder=[p.name||p.firstName,p.lastName].filter(Boolean).join(' ').trim()||p.fullName||p.nickname||'Водитель VTS';return {holder,cards:Array.isArray(x.cards)&&x.cards.length?x.cards:[{number:'4276'+Array.from({length:12},()=>Math.floor(Math.random()*10)).join(''),expiry:'12/29',balance:Number(data.balance)||0}],history:Array.isArray(x.history)?x.history:[]}}
function save(){localStorage.setItem(STORE,JSON.stringify(state));data=readData();data.balance=Number(data.balance)||0;localStorage.setItem(DATA_KEY,JSON.stringify(data))}function fmt(n){return Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽'}function digits(c){return c.number.slice(-4)}function mask(c){return '••••  ••••  ••••  '+digits(c)}function notify(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}function active(){return state.cards[selected]||state.cards[0]}function setPage(p){if(p==='transfer'&&page!=='transfer'){transferStep=1;transferDraft=null}page=p;flipped=false;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function cardMarkup(c,large=false){return `<div class="${large?'bank-card':'mini-card'}" ${large?'id="flipCard" onclick="flipCard()"':'onclick="openCard('+state.cards.indexOf(c)+')"'}>${large?`<div class="flip-inner"><div class="face front"><div class="face-logo"><span>VTS<small> BANK</small></span><span>VTS</span></div><div style="display:flex;align-items:center"><div class="chip big"></div><span class="wave">)))</span></div><div class="card-num">${c.number.replace(/(.{4})/g,'$1 ').trim()}</div><div class="card-bottom"><div><div style="font-size:10px;color:#9bbbd9;margin-bottom:5px">VALID THRU</div><div>${c.expiry}</div><div class="holder" style="margin-top:9px">${esc(state.holder)}</div></div><div class="scheme">МИР</div></div></div><div class="face back-face"><div class="magstripe"></div><div class="signature">${digits(c)} &nbsp; <b>123</b></div><div class="cvv">SIGNATURE / CVV</div><div class="back-copy">Эта карта является виртуальной картой VTS BANK. При утере данных обратитесь в настройки карты.</div><div class="face-logo" style="position:absolute;right:8%;bottom:10%;font-size:22px">VTS <small>BANK</small></div></div></div>`:`<div class="mini-top"><span>VTS</span><span>◉</span></div><div class="chip"></div><div class="mini-number">${mask(c)}</div><div class="mini-foot"><span>${esc(state.holder)}</span><b>МИР</b></div>`}</div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){data=readData();let p={...(data.profile||{})};try{p={...p,...(JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')||{})}}catch(e){};state.holder=[p.name||p.firstName,p.lastName].filter(Boolean).join(' ').trim()||p.fullName||p.nickname||state.holder||'Водитель VTS';document.getElementById('userName').textContent='👤 '+state.holder+' ▾';let c=active();let html='';if(page==='home'){html=`<div class="heading"><div><h1>Банк VTS</h1><div class="sub">Ваши финансы под контролем</div></div></div><div class="balance"><small>Общий баланс</small><div class="amount">${fmt(Number(data.balance)||0)}</div><small>Средства на ваших картах</small></div><div class="actions"><button class="action" onclick="setPage('transfer')"><span class="ico">⇄</span>Перевести</button><button class="action" onclick="setPage('payment')"><span class="ico">▤</span>Оплатить</button><button class="action" onclick="setPage('cards')"><span class="ico">▣</span>Управление картами</button></div>${statsMarkup()}<section class="loan-promo"><div class="loan-promo-copy"><span class="loan-kicker">VTS FINANCE · ДЛЯ ВОДИТЕЛЕЙ</span><h2>Твой следующий тягач ближе, чем кажется</h2><p>Оформи игровой кредит на грузовик или прицеп, рассчитай выплаты и следи за графиком прямо в VTS BANK.</p><span class="loan-rate">Грузовик от 12% за срок</span><span class="loan-rate">Прицеп от 9% за срок</span><br><button class="btn" onclick="startLoanFlow()">Подобрать кредит →</button></div><div class="loan-promo-art"><span>₽</span></div></section><div class="section-title">Последние операции <button class="link" onclick="setPage('history')">Все ›</button></div>${historyMarkup(3)}`}
else if(page==='cards'){html=`<button class="back" onclick="setPage('home')">‹ Назад</button><div class="heading"><div><h1>Мои карты</h1><div class="sub">Нажмите на карту, чтобы перевернуть её</div></div><span class="sub">${state.cards.length}/3</span></div>${state.cards.map((x,i)=>`<div style="margin-bottom:23px">${cardMarkup(x,true).replace('id="flipCard"','id="flipCard"')}<div class="card-summary"><div><span class="sub">${mask(x)}</span><strong>${fmt(x.balance)}</strong></div><button class="btn secondary" onclick="selected=${i};setPage('carddetail')">Управление</button></div></div>`).join('')}${state.cards.length<3?`<button class="add-card" style="width:100%;min-height:100px" onclick="createCard()"><span class="plus">＋</span>Оформить новую карту <small>Максимум 3 карты</small></button>`:''}`}
else if(page==='carddetail'){html=`<button class="back" onclick="setPage('cards')">‹ Мои карты</button><div class="heading"><div><h1>Карта ${selected+1}</h1><div class="sub">Нажмите на карту для переворота</div></div></div>${cardMarkup(c,true)}<div class="card-summary"><div><span class="sub">${mask(c)}</span><strong>${fmt(Number(data.balance)||0)}</strong></div></div><div class="card-actions"><button class="btn" onclick="setPage('transfer')">⇄ Перевести</button><button class="btn secondary" onclick="setPage('payment')">▤ Оплатить</button></div><div class="list-options"><button class="option" onclick="notify('Настройки карты скоро будут доступны')">⚙ Лимиты и настройки <span>›</span></button><button class="option" onclick="notify('В демо-версии блокировка не выполняет реальные операции')">♙ Блокировка карты <span>›</span></button><button class="option" onclick="notify('Это виртуальная карта VTS')">▣ Управление картой <span>›</span></button></div>`}
else if(page==='transfer'){html=transferMarkup()}
else if(page==='payment'){html=`<button class="back" onclick="setPage('home')">‹ Главная</button><div class="heading payment-heading"><div><h1>Платежи</h1><div class="sub">Переводите удобно — всё в одном месте</div></div><div class="payment-mark">VTS<span>PAY</span></div></div><section class="pay-phone panel"><div class="pay-title"><div><span class="eyebrow">БЫСТРЫЙ ПЕРЕВОД</span><h2>Перевод по телефону</h2></div><div class="phone-icon">⌕</div></div><label class="search-recipient"><span>⌕</span><input id="phoneRecipient" type="text" placeholder="Введите номер телефона или имя" autocomplete="off"></label><div class="phone-extra"><span class="secure-dot"></span>Перевод внутри демо-системы VTS</div><div class="phone-transfer-fields"><label class="field">С карты<select id="phoneSource">${state.cards.map((x,i)=>`<option value="${i}">${mask(x)} — ${fmt(x.balance)}</option>`).join('')}</select></label><label class="field">Сумма, ₽<input id="phoneSum" type="number" min="0.01" step="0.01" placeholder="Введите сумму"></label><button class="btn full" onclick="submitPhonePayment()">Продолжить перевод <span>→</span></button></div></section><section class="pay-methods"><div class="section-title"><div><h2>Способы перевода</h2><div class="sub">Выберите удобный вариант</div></div><span class="method-count">03</span></div><div class="method-grid"><button class="method-card" onclick="setPage('transfer')"><span class="method-icon blue">⇄</span><strong>Между счетами</strong><small>Перевод между картами VTS</small><span class="method-arrow">↗</span></button><button class="method-card" onclick="openPaymentMethod('card')"><span class="method-icon violet">▰</span><strong>По номеру карты</strong><small>Укажите карту получателя</small><span class="method-arrow">↗</span></button><button class="method-card" onclick="openPaymentMethod('other')"><span class="method-icon cyan">◎</span><strong>Другие платежи</strong><small>Услуги и покупки в VTS</small><span class="method-arrow">↗</span></button></div></section><section class="fuel-entry"><div class="fuel-symbol">⛽</div><div style="flex:1;min-width:180px"><h3>Заправка</h3><p>Выберите колонку, укажите сумму и оплатите топливо картой VTS BANK.</p></div><button class="btn" onclick="startFuelFlow()">Заправиться <span>→</span></button></section><section class="service-entry"><div class="service-symbol">🔧</div><div style="flex:1;min-width:160px"><h3>Автосервис</h3><p>Ремонт грузовика, замена шин, обслуживание прицепа и покраска. Выбери услуги и оплати одним платежом.</p></div><button class="btn" onclick="startServiceFlow()">В сервис →</button></section><div class="payment-note"><span>ⓘ</span><div><strong>Безопасно и просто</strong><p>Все операции здесь демонстрационные. Реальные банковские переводы не выполняются.</p></div></div>`}
else if(page==='fuel'){html=fuelMarkup()}
else if(page==='service'){html=serviceMarkup()}
else if(page==='loans'){html=loanMarkup()}
else if(page==='history'){html=`<div class="heading"><div><h1>История операций</h1><div class="sub">Нажмите на операцию, чтобы открыть подробности</div></div><button class="btn secondary" onclick="exportHistory()">Экспорт ↗</button></div>${statsMarkup()}${historyMarkup()}`}
else if(page==='settings'){html=`<div class="heading"><div><h1>Настройки банка</h1><div class="sub">Настройте интерфейс VTS BANK под себя</div></div></div><div class="panel form"><div class="settings-group"><h3>Профиль карты</h3><label class="field">Имя и фамилия владельца карты<input id="holderInput" value="${esc(state.holder)}" maxlength="40"></label><button class="btn" onclick="saveHolder()">Сохранить имя</button><p class="hint">Имя отобразится на всех виртуальных картах VTS.</p></div><div class="settings-group"><h3>Внешний вид и удобство</h3><label class="setting-row"><span>Компактный интерфейс<small>Уменьшить отступы в банке</small></span><input type="checkbox" id="compactSetting" onchange="toggleSetting('compact',this.checked)"></label><label class="setting-row"><span>Показывать подсказки<small>Информационные сообщения об операциях</small></span><input type="checkbox" id="tipsSetting" onchange="toggleSetting('tips',this.checked)"></label><label class="setting-row"><span>Подтверждать очистку истории<small>Запрашивать подтверждение перед удалением</small></span><input type="checkbox" id="confirmSetting" onchange="toggleSetting('confirmClear',this.checked)"></label></div><div class="settings-group"><h3>Данные банка</h3><div class="setting-row"><span>Виртуальные карты<small>Можно создать до 3 карт</small></span><strong>${state.cards.length}/3</strong></div><div class="settings-actions"><button class="btn secondary" onclick="exportData()">Скачать резервную копию</button><button class="btn secondary" onclick="exportHistory()">Экспорт истории</button></div><button class="btn secondary full" onclick="resetBankSettings()">Сбросить настройки интерфейса</button></div><div class="settings-group"><h3>Опасная зона</h3><p class="hint">Очистка истории удалит только список операций VTS BANK, не баланс и не профиль.</p><button class="danger-btn full" onclick="clearHistory()">Очистить историю операций</button></div><p class="hint">VTS BANK — локальная демонстрационная система. Настройки и операции хранятся в браузере на этом устройстве.</p></div>`}
document.getElementById('content').innerHTML=html;if(page==='settings'){const prefs=getPrefs();['compact','tips','confirmClear'].forEach(k=>{const el=document.getElementById(({compact:'compactSetting',tips:'tipsSetting',confirmClear:'confirmSetting'})[k]);if(el)el.checked=!!prefs[k]});document.body.classList.toggle('compact-ui',!!prefs.compact)}if(flipped){let el=document.getElementById('flipCard');if(el)el.classList.add('flipped')}}
function exitBank(){const ref=document.referrer;try{if(ref&&new URL(ref,location.href).href!==location.href){window.location.href=ref;return}}catch(e){};window.location.href='./index.html'}
function startFuelFlow(){fuelStep=1;fuelPump=1;fuelAmount='0';setPage('fuel')}
function startServiceFlow(){serviceStep=1;serviceTruck='';serviceItems=[];setPage('service')}
function serviceMarkup(){const total=serviceItems.reduce((sum,id)=>sum+(SERVICE_CATALOG.find(x=>x.id===id)?.price||0),0);let body='';if(serviceStep===1){body=`<h1>🔧 Автосервис VTS</h1><p class="sub">Шаг 1 из 3 · Укажи марку и модель грузовика</p><label class="field">Марка и модель грузовика<input id="serviceTruckInput" maxlength="70" placeholder="Например, Volvo FH16 2022" value="${esc(serviceTruck)}"></label><p class="hint">Можно вписать любой грузовик из ETS2 — Volvo, Scania, MAN, DAF, Renault, Mercedes-Benz, Iveco и другие.</p><button class="btn full" onclick="serviceNextTruck()">Выбрать ремонт →</button>`}else if(serviceStep===2){body=`<h1>Что нужно сделать?</h1><p class="sub">Шаг 2 из 3 · ${esc(serviceTruck)}</p><div class="service-list">${SERVICE_CATALOG.map(x=>`<label class="service-choice"><input type="checkbox" ${serviceItems.includes(x.id)?'checked':''} onchange="toggleServiceItem('${x.id}',this.checked)"><span><b>${x.name}</b><small>${x.desc}</small></span><strong class="service-price">${fmt(x.price)}</strong></label>`).join('')}</div><p class="hint">Цены условные для ролевой системы VTS, не реальные цены ремонта в ETS2. Капитальный ремонт можно выбрать отдельно или вместе с другими работами.</p><button class="btn full" onclick="serviceNextPayment()">К оплате →</button><button class="btn secondary full" onclick="serviceStep=1;render()">← Назад</button>`}else if(serviceStep===3){body=`<h1>Проверь заказ</h1><p class="sub">Шаг 3 из 3 · Перед оплатой</p><div class="panel"><div class="section-title" style="margin-top:0">${esc(serviceTruck)}</div>${serviceItems.map(id=>{const x=SERVICE_CATALOG.find(y=>y.id===id);return `<div class="detail-row"><span>${x.name}</span><strong>${fmt(x.price)}</strong></div>`}).join('')}<div class="service-total"><span class="sub">Итого к списанию</span><strong>${fmt(total)}</strong><p class="hint">Оплата с основного баланса VTS BANK · комиссия 0 ₽</p></div><button class="btn full" onclick="payService()">✓ Оплатить ремонт</button><button class="btn secondary full" onclick="serviceStep=2;render()">← Изменить услуги</button></div>`}else{body=`<div class="service-receipt"><div class="service-check">✓</div><span class="detail-status">ОПЛАТА УСПЕШНА</span><h2>Заказ принят сервисом</h2><p class="sub">Ремонт записан в историю VTS BANK</p><div class="detail-list"><div class="detail-row"><span>Грузовик</span><strong>${esc(serviceTruck)}</strong></div><div class="detail-row"><span>Работы</span><strong>${serviceItems.length}</strong></div><div class="detail-row"><span>Сумма</span><strong>${fmt(total)}</strong></div><div class="detail-row"><span>Комиссия</span><strong>0,00 ₽</strong></div><div class="detail-row"><span>Номер заказа</span><strong>${esc(window.lastServiceId||'VTS-SERVICE')}</strong></div><div class="detail-row"><span>Дата</span><strong>${esc(window.lastServiceDate||'')}</strong></div></div><p class="hint">Демонстрационная оплата VTS. В ETS2 ремонт грузовика автоматически не выполняется — это запись для твоего RP.</p></div><button class="btn full" onclick="setPage('history')">Посмотреть историю →</button><button class="btn secondary full" onclick="setPage('payment')">Вернуться в платежи</button>`}return `<button class="back" onclick="setPage('payment')">‹ Платежи</button><div class="panel form">${body}</div>`}
function serviceNextTruck(){const v=(document.getElementById('serviceTruckInput')?.value||'').trim();if(!v)return notify('Введи марку и модель грузовика');serviceTruck=v;serviceStep=2;render()}
function toggleServiceItem(id,checked){if(checked){if(id==='full')serviceItems=['full'];else serviceItems=[...serviceItems.filter(x=>x!=='full'),id]}else serviceItems=serviceItems.filter(x=>x!==id);render()}
function serviceNextPayment(){if(!serviceItems.length)return notify('Выбери хотя бы одну услугу');serviceStep=3;render()}
function payService(){const total=serviceItems.reduce((sum,id)=>sum+(SERVICE_CATALOG.find(x=>x.id===id)?.price||0),0);data=readData();data.balance=Number(data.balance)||0;if(!serviceTruck.trim()||!serviceItems.length)return notify('Проверь грузовик и выбранные услуги');if(total>data.balance)return notify('Недостаточно средств на балансе VTS');data.balance-=total;if(state.cards[selected])state.cards[selected].balance=data.balance;const date=new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});const id='VTS-SERVICE-'+Date.now();window.lastServiceId=id;window.lastServiceDate=date;localStorage.setItem(DATA_KEY,JSON.stringify(data));state.history.unshift({id,kind:'Автосервис',title:'Ремонт · '+serviceTruck,recipient:serviceTruck,truck:serviceTruck,services:serviceItems.map(x=>SERVICE_CATALOG.find(y=>y.id===x)?.name||x),sourceCard:mask(active()),amount:total,commission:0,income:false,date});save();serviceStep=4;render();notify('Оплата автосервиса прошла успешно')}
function fuelMarkup(){const steps=[['▣','Колонка'],['₽','Сумма'],['⛽','Оплата'],['✓','Готово']];const indicators=steps.map((x,i)=>`<div class="fuel-step ${i+1===fuelStep?'active':i+1<fuelStep?'done':''}">${i+1<fuelStep?'✓':x[0]}</div>${i<3?'<div class="fuel-connector"></div>':''}`).join('');let body='';
if(fuelStep===1){body=`<h1 class="fuel-title">Выберите колонку</h1><div class="panel fuel-pump-list">${[1,2].map(n=>`<button class="fuel-pump ${fuelPump===n?'selected':''}" onclick="fuelPump=${n};render()"><span style="font-size:32px;color:#268bff">⛽</span><b>${n}</b><small>${fuelPump===n?'Выбрана':'Свободна'}</small></button>`).join('')}</div><button class="btn full" onclick="fuelNext(2)">Продолжить →</button>`}
else if(fuelStep===2){let amount=Number(fuelAmount)||0;let liters=amount/70.79;body=`<h1 class="fuel-title">Сумма заправки</h1><div class="fuel-summary"><div class="fuel-total">${fmt(amount)}</div><p>Станция Stokes · колонка ${fuelPump}</p><p>Примерно ${liters.toLocaleString('ru-RU',{maximumFractionDigits:1})} л по 70,79 ₽/л</p></div><div class="fuel-adjust"><button onclick="fuelAdjust(-500)" ${amount<500?'disabled':''}>−500 ₽</button><button onclick="fuelToggleUnits()">₽ Рубли ⇄ Литры</button><button onclick="fuelAdjust(500)">+500 ₽</button></div><div class="fuel-keypad">${['1','2','3','4','5','6','7','8','9','full','0','del'].map(k=>`<button class="fuel-key" onclick="fuelKey('${k}')">${k==='full'?'Полный бак':k==='del'?'⌫':k}</button>`).join('')}</div><button class="btn full" onclick="fuelNext(3)">К оплате →</button>`}
else if(fuelStep===3){body=`<div class="fuel-warning"><h1 class="fuel-title">Не снимайте пистолет до оплаты</h1><p class="sub">Сначала оплатите заправку, а потом заправляйтесь.</p><div class="fuel-nozzle">⛽</div><div class="fuel-summary"><div class="fuel-total">${fmt(Number(fuelAmount)||0)}</div><p>Stokes · колонка ${fuelPump}</p></div><button class="btn full" onclick="fuelPay()">Оплатить ${fmt(Number(fuelAmount)||0)}</button></div>`}
else {body=`<div class="fuel-warning"><div class="fuel-nozzle" style="color:#39dba5;background:radial-gradient(circle,#164c42,#0a1b2a)">✓</div><h1 class="fuel-title">Заправка оплачена</h1><p class="sub">Платёж успешно записан в историю VTS BANK.</p><div class="fuel-summary"><div class="fuel-total">${fmt(Number(fuelAmount)||0)}</div><p>Stokes · колонка ${fuelPump}</p></div><button class="btn full" onclick="setPage('history')">Посмотреть историю →</button><button class="btn secondary full" style="margin-top:10px" onclick="setPage('payment')">Вернуться в платежи</button></div>`}
return `<button class="back" onclick="setPage('payment')">‹ Платежи</button><div class="fuel-flow"><div class="fuel-steps">${indicators}</div>${body}</div>`}
function fuelNext(step){const amount=Number(fuelAmount)||0;if(step===3&&amount<=0)return notify('Сначала укажите сумму заправки');fuelStep=step;render()}
function fuelAdjust(delta){fuelAmount=String(Math.max(0,(Number(fuelAmount)||0)+delta));render()}
function fuelKey(key){if(key==='full'){fuelAmount='3539.50'}else if(key==='del'){fuelAmount=fuelAmount.length>1?fuelAmount.slice(0,-1):'0'}else{fuelAmount=(fuelAmount==='0'?'':fuelAmount)+key;if(Number(fuelAmount)>100000)fuelAmount='100000'}render()}
function fuelToggleUnits(){notify('Расчёт: 70,79 ₽ за литр · ввод суммы в рублях');}
function fuelPay(){data=readData();data.balance=Number(data.balance)||0;const amount=Number(fuelAmount)||0;if(amount<=0)return notify('Укажите сумму заправки');if(amount>data.balance)return notify('Недостаточно средств на балансе VTS');data.balance-=amount;if(state.cards[selected])state.cards[selected].balance=data.balance;localStorage.setItem(DATA_KEY,JSON.stringify(data));state.history.unshift({id:'VTS-'+Date.now(),kind:'Оплата',title:`Заправка Stokes · колонка ${fuelPump}`,recipient:`Stokes · колонка ${fuelPump}`,sourceCard:mask(active()),amount,income:false,date:new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})});save();fuelStep=4;render();notify('Заправка оплачена')}
function getPrefs(){try{return JSON.parse(localStorage.getItem('vts_bank_prefs_v1')||'{}')||{}}catch(e){return {}}}
function toggleSetting(key,value){const p=getPrefs();p[key]=value;localStorage.setItem('vts_bank_prefs_v1',JSON.stringify(p));document.body.classList.toggle('compact-ui',!!p.compact);if(p.tips)notify('Настройка сохранена')}
function resetBankSettings(){localStorage.removeItem('vts_bank_prefs_v1');render();notify('Настройки интерфейса сброшены')}
function clearHistory(){const prefs=getPrefs();if((prefs.confirmClear!==false)&&!confirm('Точно очистить историю операций? Баланс и профиль останутся без изменений.'))return;state.history=[];save();render();notify('История операций очищена')}
function downloadText(name,textValue,type='text/plain'){const blob=new Blob([textValue],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportHistory(){downloadText('vts-bank-history.json',JSON.stringify(state.history,null,2),'application/json');notify('Экспорт истории подготовлен')}
function exportData(){downloadText('vts-bank-backup.json',JSON.stringify({exportedAt:new Date().toISOString(),state,data:readData()},null,2),'application/json');notify('Резервная копия подготовлена')}
function statsMarkup(){const list=Array.isArray(state.history)?state.history:[];const expenses=list.filter(x=>!x.income).reduce((a,x)=>a+(Number(x.amount)||0),0);const incoming=list.filter(x=>x.income).reduce((a,x)=>a+(Number(x.amount)||0),0);const transfers=list.filter(x=>String(x.kind||'').toLowerCase().includes('перевод')&&!x.income).reduce((a,x)=>a+(Number(x.amount)||0),0);const max=Math.max(expenses,incoming,transfers,1);return `<div class="section-title"><span>Статистика операций</span><span class="sub" style="font-size:12px">По истории VTS BANK</span></div><div class="stats-grid"><div class="stat-card"><div class="stat-mark">↗</div><small>Расходы</small><strong>${fmt(expenses)}</strong><div class="stats-sub">Все списания</div></div><div class="stat-card"><div class="stat-mark">⇄</div><small>Переводы</small><strong>${fmt(transfers)}</strong><div class="stats-sub">Отправленные суммы</div></div><div class="stat-card"><div class="stat-mark">↙</div><small>Поступления</small><strong>${fmt(incoming)}</strong><div class="stats-sub">Все зачисления</div></div></div><div class="panel"><div class="section-title" style="margin-top:0">Сравнение операций</div><div class="stat-bars"><div class="bar-line"><span>Расходы</span><div class="bar-track"><div class="bar-fill" style="width:${expenses/max*100}%"></div></div><b>${fmt(expenses)}</b></div><div class="bar-line"><span>Переводы</span><div class="bar-track"><div class="bar-fill" style="width:${transfers/max*100}%"></div></div><b>${fmt(transfers)}</b></div><div class="bar-line"><span>Поступления</span><div class="bar-track"><div class="bar-fill income" style="width:${incoming/max*100}%"></div></div><b>${fmt(incoming)}</b></div></div><p class="hint">Статистика рассчитывается по операциям, записанным в истории банка.</p></div>`}
function historyMarkup(limit=Infinity){if(!state.history.length)return `<div class="panel empty"><div class="doc">▤</div><b>Здесь пока нет операций</b><div style="margin-top:6px">Ваши переводы и платежи появятся здесь</div></div>`;return `<div class="transactions">${state.history.slice(0,limit).map((x,i)=>`<button type="button" class="tx" style="width:100%;text-align:left;background:transparent;color:inherit;border:0;border-bottom:1px solid #102b48" onclick="showTransaction(${i})"><div class="txicon">${x.kind==='Пополнение'?'↙':x.kind==='Перевод'?'⇄':String(x.title||'').includes('Заправка')?'⛽':'▤'}</div><div class="txmeta">${esc(x.title||'Операция')}<small>${esc(x.date||'Дата не указана')} · ${esc(x.kind||'Операция')}</small></div><div class="txamount ${x.income?'green':'red'}">${x.income?'+':'−'} ${fmt(x.amount)}<small style="display:block;color:#6f9dc4;text-align:right">Подробнее ›</small></div></button>`).join('')}</div>`}
function showTransaction(index){const x=state.history[index];if(!x)return;const amount=Number(x.amount)||0;const date=x.date||'Дата не указана';const title=x.title||'Операция';const kind=x.kind||'Операция';const isIncome=!!x.income;const id=x.id||('VTS-'+String(index+1).padStart(6,'0'));const source=x.sourceCard||x.card||mask(active());const recipient=x.recipient||title;const modal=document.createElement('div');modal.className='modal-backdrop';modal.id='transactionModal';modal.innerHTML=`<section class="detail-modal" role="dialog" aria-modal="true" aria-label="Детали операции"><button class="modal-close" onclick="closeTransaction()" aria-label="Закрыть">×</button><div class="detail-icon">${String(title).includes('Заправка')?'⛽':kind==='Перевод'?'⇄':isIncome?'↙':'▤'}</div><div class="sub">${esc(kind)}</div><h2 style="margin:5px 0">${esc(title)}</h2><div class="detail-amount ${isIncome?'green':'red'}">${isIncome?'+':'−'} ${fmt(amount)}</div><span class="detail-status">✓ Записано в истории</span><div class="detail-list"><div class="detail-row"><span>Дата и время</span><strong>${esc(date)}</strong></div><div class="detail-row"><span>Статус</span><strong>Выполнено (демо)</strong></div><div class="detail-row"><span>Тип операции</span><strong>${esc(kind)}</strong></div><div class="detail-row"><span>Получатель / назначение</span><strong>${esc(recipient)}</strong></div><div class="detail-row"><span>Карта</span><strong>${esc(source)}</strong></div><div class="detail-row"><span>Номер операции</span><strong>${esc(id)}</strong></div><div class="detail-row"><span>Комиссия</span><strong>0,00 ₽</strong></div></div><p class="hint">Это запись локальной демонстрационной системы VTS BANK, а не подтверждение реального банковского платежа.</p><button class="btn full" onclick="closeTransaction()">Готово</button></section>`;modal.addEventListener('click',e=>{if(e.target===modal)closeTransaction()});document.body.appendChild(modal)}
function closeTransaction(){document.getElementById('transactionModal')?.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTransaction()});
function flipCard(){flipped=!flipped;document.getElementById('flipCard')?.classList.toggle('flipped',flipped)}function openCard(i){selected=i;setPage('carddetail')}function createCard(){if(state.cards.length>=3)return notify('Можно создать максимум 3 карты');let n='4276'+Array.from({length:12},()=>Math.floor(Math.random()*10)).join('');state.cards.push({number:n,expiry:'12/30',balance:0});selected=state.cards.length-1;save();setPage('cards');notify('Новая карта VTS создана')}
function submitOperation(kind){let i=Number(document.getElementById('source').value),recipient=document.getElementById('recipient').value.trim(),amount=Number(document.getElementById('sum').value);if(!recipient)return notify('Укажите получателя или назначение');if(!Number.isFinite(amount)||amount<=0)return notify('Введите корректную сумму');let c=state.cards[i];data=readData();data.balance=Number(data.balance)||0;if(amount>data.balance)return notify('Недостаточно средств');data.balance-=amount;c.balance=data.balance;localStorage.setItem(DATA_KEY,JSON.stringify(data));state.history.unshift({id:'VTS-'+Date.now(),kind:kind==='transfer'?'Перевод':'Оплата',title:recipient,recipient,sourceCard:mask(c),amount,income:false,date:new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})});save();setPage('history');notify('Демо-операция записана в историю')}
function submitPhonePayment(){transferMethod='phone';setPage('transfer');transferStep=2;render()}
function openPaymentMethod(kind){if(kind==='card'){transferMethod='card';setPage('transfer');transferStep=2;render()}else notify('Дополнительные платежи появятся в следующих обновлениях VTS')}
function transferMarkup(){const progress=`<div class="loan-progress"><span class="on"></span><span class="${transferStep>=2?'on':''}"></span><span class="${transferStep>=3?'on':''}"></span></div>`;if(transferStep===4&&transferDraft){const t=transferDraft;return `<button class="back" onclick="setPage('home')">‹ Главная</button><div class="panel form"><div class="receipt-success"><div class="check">✓</div><span class="detail-status">ПЕРЕВОД ВЫПОЛНЕН · ДЕМО</span><h2>Деньги отправлены</h2><div class="receipt-amount">${fmt(t.amount)}</div><p class="sub">Получатель: ${esc(t.recipient)}</p></div><div class="detail-list"><div class="detail-row"><span>Банк получателя</span><strong>${esc(t.bank)}</strong></div><div class="detail-row"><span>Способ</span><strong>${t.method==='phone'?'По номеру телефона':'По номеру карты'}</strong></div><div class="detail-row"><span>Реквизиты</span><strong>${esc(t.details)}</strong></div><div class="detail-row"><span>С карты</span><strong>${esc(mask(state.cards[t.source]||active()))}</strong></div><div class="detail-row"><span>Комиссия</span><strong>0,00 ₽</strong></div><div class="detail-row"><span>Номер операции</span><strong>${esc(t.id)}</strong></div><div class="detail-row"><span>Дата</span><strong>${esc(t.date)}</strong></div>${t.message?`<div class="detail-row"><span>Сообщение</span><strong>${esc(t.message)}</strong></div>`:''}</div><p class="hint">Это запись локальной демонстрационной системы VTS BANK. Реальные переводы не выполняются.</p><button class="btn full" onclick="setPage('history')">Открыть историю</button><button class="btn secondary full" onclick="transferStep=1;setPage('transfer')">Новый перевод</button></div>`}if(transferStep===3&&transferDraft){const t=transferDraft;return `<button class="back" onclick="transferStep=2;render()">‹ Изменить данные</button><div class="panel form"><div class="transfer-hero"><span class="loan-kicker">ПРОВЕРКА ПЕРЕВОДА</span><h1>Всё верно?</h1><div class="sub">Проверь реквизиты перед подтверждением</div></div><div class="detail-list"><div class="detail-row"><span>Получатель</span><strong>${esc(t.recipient)}</strong></div><div class="detail-row"><span>Банк</span><strong>${esc(t.bank)}</strong></div><div class="detail-row"><span>Способ</span><strong>${t.method==='phone'?'По номеру телефона':'По номеру карты'}</strong></div><div class="detail-row"><span>Реквизиты</span><strong>${esc(t.details)}</strong></div><div class="detail-row"><span>Сумма перевода</span><strong>${fmt(t.amount)}</strong></div><div class="detail-row"><span>Комиссия</span><strong>0,00 ₽</strong></div><div class="detail-row"><span>Списать всего</span><strong>${fmt(t.amount)}</strong></div></div><button class="btn full" onclick="confirmTransfer()">✓ Подтвердить перевод</button><button class="btn secondary full" onclick="transferStep=2;render()">Назад</button><p class="hint">Демо-операция: после подтверждения сумма будет списана с баланса VTS.</p></div>`}return `<button class="back" onclick="setPage('home')">‹ Главная</button><div class="transfer-hero"><span class="loan-kicker">VTS PAY · БЕЗОПАСНЫЙ СЦЕНАРИЙ</span><h1>Переводы</h1><div class="sub">Шаг ${transferStep===1?'1':'2'} из 3 · ${transferStep===1?'Выбери способ перевода':'Укажи реквизиты и сумму'}</div>${progress}</div>${transferStep===1?`<div class="panel"><h2>Как отправить деньги?</h2><div class="transfer-methods"><button class="transfer-choice ${transferMethod==='phone'?'active':''}" onclick="transferMethod='phone';render()"><span class="method-icon blue">⌕</span><strong>По номеру телефона</strong><small>Имя или телефон получателя</small></button><button class="transfer-choice ${transferMethod==='card'?'active':''}" onclick="transferMethod='card';render()"><span class="method-icon violet">▰</span><strong>По номеру карты</strong><small>Номер карты получателя</small></button></div><button class="btn full" onclick="transferStep=2;render()">Продолжить →</button></div>`:`<div class="panel form"><h2>${transferMethod==='phone'?'Перевод по телефону':'Перевод по номеру карты'}</h2><label class="field">Банк получателя<select id="transferBank"><option>VTS BANK</option><option>Сбербанк</option><option>Т-Банк</option><option>ВТБ</option><option>Альфа-Банк</option><option>Газпромбанк</option></select></label><label class="field">${transferMethod==='phone'?'Имя получателя':'Имя получателя'}<input id="transferRecipient" maxlength="80" placeholder="Например, Алексей Иванов"></label><label class="field">${transferMethod==='phone'?'Номер телефона':'Номер карты'}<input id="transferDetails" maxlength="40" placeholder="${transferMethod==='phone'?'+7 900 000-00-00':'0000 0000 0000 0000'}"></label><label class="field">Списать с карты<select id="transferSource">${state.cards.map((x,i)=>`<option value="${i}" ${i===selected?'selected':''}>${mask(x)} — ${fmt(data.balance)}</option>`).join('')}</select></label><label class="field">Сумма, ₽<input id="transferAmount" type="number" min="1" step="0.01" placeholder="0,00"></label><label class="field">Сообщение (необязательно)<input id="transferMessage" maxlength="120" placeholder="Например, за доставку"></label><div class="loan-metric"><small>Комиссия</small><strong>0,00 ₽</strong><p class="hint">Демонстрационная комиссия VTS BANK — 0 ₽.</p></div><button class="btn full" onclick="prepareTransfer()">Проверить перевод →</button><button class="btn secondary full" onclick="transferStep=1;render()">← Способ перевода</button></div>`}`}
function prepareTransfer(){const recipient=(document.getElementById('transferRecipient')?.value||'').trim(),details=(document.getElementById('transferDetails')?.value||'').trim(),bank=document.getElementById('transferBank')?.value||'VTS BANK',source=Number(document.getElementById('transferSource')?.value||0),amount=Number(document.getElementById('transferAmount')?.value),message=(document.getElementById('transferMessage')?.value||'').trim();if(!recipient)return notify('Укажи имя получателя');if(!details)return notify(transferMethod==='phone'?'Укажи номер телефона':'Укажи номер карты');if(!Number.isFinite(amount)||amount<=0)return notify('Введи корректную сумму');data=readData();if(amount>(Number(data.balance)||0))return notify('Недостаточно средств на балансе VTS');transferDraft={recipient,details,bank,source,amount,message,method:transferMethod,id:'VTS-TR-'+Date.now(),date:new Date().toLocaleString('ru-RU')};transferStep=3;render()}
function confirmTransfer(){if(!transferDraft)return;const t=transferDraft;data=readData();data.balance=Number(data.balance)||0;if(t.amount>data.balance)return notify('Недостаточно средств на балансе VTS');data.balance-=t.amount;selected=t.source;if(state.cards[selected])state.cards[selected].balance=data.balance;localStorage.setItem(DATA_KEY,JSON.stringify(data));state.history.unshift({id:t.id,kind:'Перевод',title:'Перевод · '+t.recipient,recipient:t.recipient,bank:t.bank,details:t.details,message:t.message,sourceCard:mask(active()),amount:t.amount,commission:0,income:false,date:t.date});save();transferStep=4;render();notify('Демо-перевод выполнен')}
function startLoanFlow(){loanStep=1;loanKind='truck';loanAmount='2500000';loanDown='0';loanDays=180;loanDraft=null;setPage('loans')}
function loanRate(){return loanKind==='truck'?0.12:0.09}
function loanCalc(){const principal=Math.max(0,Number(loanAmount)||0)-Math.max(0,Number(loanDown)||0);const total=principal*(1+loanRate());return {principal,total,interest:total-principal,daily:total/Math.max(1,Number(loanDays)||1)}}
function loanMarkup(){const loans=(()=>{try{return JSON.parse(localStorage.getItem('vts_bank_loans_v1')||'[]')}catch(e){return []}})();const calc=loanCalc();if(loanStep===4&&loanDraft){const l=loanDraft;return `<button class="back" onclick="setPage('home')">‹ Главная</button><div class="panel form"><div class="receipt-success"><div class="check">✓</div><span class="detail-status">КРЕДИТ ОФОРМЛЕН · ДЕМО</span><h2>Поздравляем с финансированием!</h2><p class="sub">Средства зачислены на баланс VTS BANK</p><div class="receipt-amount">${fmt(l.principal)}</div></div><div class="detail-list"><div class="detail-row"><span>Тип кредита</span><strong>${l.kind==='truck'?'На грузовик':'На прицеп'}</strong></div><div class="detail-row"><span>Процент за срок</span><strong>${Math.round(l.rate*100)}%</strong></div><div class="detail-row"><span>Переплата</span><strong>${fmt(l.interest)}</strong></div><div class="detail-row"><span>Всего вернуть</span><strong>${fmt(l.total)}</strong></div><div class="detail-row"><span>Срок</span><strong>${l.days} дней</strong></div><div class="detail-row"><span>Платёж в день</span><strong>${fmt(l.daily)}</strong></div><div class="detail-row"><span>Первый платёж</span><strong>${esc(l.firstDue)}</strong></div><div class="detail-row"><span>Номер договора</span><strong>${esc(l.id)}</strong></div></div><p class="hint">Кредит — игровая механика VTS RP. Это не реальный финансовый продукт.</p><button class="btn full" onclick="loanStep=1;setPage('loans')">Мои кредиты</button></div>`}return `<button class="back" onclick="setPage('home')">‹ Главная</button><div class="heading"><div><h1>Кредиты VTS</h1><div class="sub">Финансирование тягача и прицепа — с понятным графиком</div></div></div><div class="loan-progress"><span class="on"></span><span class="${loanStep>=2?'on':''}"></span><span class="${loanStep>=3?'on':''}"></span></div>${loanStep===1?`<div class="panel"><h2>Что хочешь приобрести?</h2><p class="sub">Выбери тип кредита, затем рассчитаем полную стоимость и ежедневные платежи.</p><div class="loan-type-grid"><button class="loan-type" onclick="loanKind='truck';loanStep=2;loanAmount='2500000';loanDown='0';render()"><div class="loan-icon">🚛</div><strong>Кредит на грузовик</strong><p>На покупку тягача для личных рейсов или расширения автопарка.</p><span class="loan-rate">12% за выбранный срок</span></button><button class="loan-type" onclick="loanKind='trailer';loanStep=2;loanAmount='650000';loanDown='0';render()"><div class="loan-icon">🚚</div><strong>Кредит на прицеп</strong><p>На покупку полуприцепа под разные типы перевозок.</p><span class="loan-rate">9% за выбранный срок</span></button></div><p class="hint">Ставки и цены — условные игровые параметры VTS RP, а не реальные банковские предложения.</p></div>`:loanStep===2?`<div class="panel form"><h2>${loanKind==='truck'?'Кредит на грузовик':'Кредит на прицеп'}</h2><p class="sub">Шаг 1 из 2 · Укажи стоимость и срок</p><label class="field">${loanKind==='truck'?'Стоимость грузовика':'Стоимость прицепа'}, ₽<input id="loanAmountInput" type="number" min="10000" step="10000" value="${esc(loanAmount)}" oninput="loanAmount=this.value;updateLoanPreview()"></label><label class="field">Первоначальный взнос, ₽<input id="loanDownInput" type="number" min="0" step="1000" value="${esc(loanDown)}" oninput="loanDown=this.value;updateLoanPreview()"></label><label class="field">Срок погашения<select id="loanDaysInput" onchange="loanDays=Number(this.value);render()"><option value="30" ${loanDays===30?'selected':''}>30 дней</option><option value="60" ${loanDays===60?'selected':''}>60 дней</option><option value="90" ${loanDays===90?'selected':''}>90 дней</option><option value="180" ${loanDays===180?'selected':''}>180 дней</option><option value="365" ${loanDays===365?'selected':''}>365 дней</option></select></label><div id="loanPreview" class="loan-summary"><span class="loan-kicker">ПРЕДВАРИТЕЛЬНЫЙ РАСЧЁТ</span><div class="loan-metrics"><div class="loan-metric"><small>Сумма кредита</small><strong>${fmt(calc.principal)}</strong></div><div class="loan-metric"><small>Процент за срок</small><strong>${Math.round(loanRate()*100)}%</strong></div><div class="loan-metric"><small>Переплата</small><strong>${fmt(calc.interest)}</strong></div><div class="loan-metric"><small>Платёж в день</small><strong>${fmt(calc.daily)}</strong></div></div><div class="loan-total">${fmt(calc.total)}</div><small class="sub">Всего к возврату за ${loanDays} дней</small></div><button class="btn full" onclick="reviewLoan()">Проверить условия →</button><button class="btn secondary full" onclick="loanStep=1;render()">Назад</button></div>`:`<div class="panel form"><h2>Проверь условия кредита</h2><p class="sub">Шаг 2 из 2 · До подтверждения</p><div class="loan-summary"><span class="loan-kicker">VTS FINANCE</span><div class="loan-total">${fmt(calc.principal)}</div><small class="sub">Сумма, которую получишь</small><div class="detail-list"><div class="detail-row"><span>Первоначальный взнос</span><strong>${fmt(Number(loanDown)||0)}</strong></div><div class="detail-row"><span>Ставка за весь срок</span><strong>${Math.round(loanRate()*100)}%</strong></div><div class="detail-row"><span>Переплата</span><strong>${fmt(calc.interest)}</strong></div><div class="detail-row"><span>Всего вернуть</span><strong>${fmt(calc.total)}</strong></div><div class="detail-row"><span>Срок</span><strong>${loanDays} дней</strong></div><div class="detail-row"><span>Платёж каждый день</span><strong>${fmt(calc.daily)}</strong></div><div class="detail-row"><span>Дата первого платежа</span><strong>${esc(new Date(Date.now()+86400000).toLocaleDateString('ru-RU'))}</strong></div></div></div><p class="loan-day-note">Ежедневный платёж рассчитан как общая сумма возврата, делённая на количество дней. Платежи отмечаются вручную в разделе «Мои кредиты».</p><button class="btn full" onclick="approveLoan()">✓ Подтвердить кредит</button><button class="btn secondary full" onclick="loanStep=2;render()">Изменить условия</button></div>`}${loans.length?`<div class="section-title">Мои кредиты <span class="sub">${loans.filter(x=>x.status==='active').length} активных</span></div>${loans.map(l=>`<div class="loan-list-item"><span class="loan-status">${l.status==='active'?'АКТИВНЫЙ КРЕДИТ':'ПОГАШЕН'}</span><h3>${l.kind==='truck'?'🚛 Кредит на грузовик':'🚚 Кредит на прицеп'}</h3><div class="loan-metrics"><div class="loan-metric"><small>Осталось выплатить</small><strong>${fmt(l.remaining)}</strong></div><div class="loan-metric"><small>Платёж в день</small><strong>${fmt(l.daily)}</strong></div></div><p class="loan-day-note">Договор ${esc(l.id)} · Оплачено ${l.paidDays}/${l.days} дней</p>${l.status==='active'?`<button class="btn full" onclick="payLoanDay('${l.id}')">Оплатить дневной платёж · ${fmt(Math.min(l.daily,l.remaining))}</button>`:''}</div>`).join('')}`:''}`}
function updateLoanPreview(){loanAmount=document.getElementById('loanAmountInput')?.value||loanAmount;loanDown=document.getElementById('loanDownInput')?.value||loanDown;const c=loanCalc(),el=document.getElementById('loanPreview');if(el)el.innerHTML=`<span class="loan-kicker">ПРЕДВАРИТЕЛЬНЫЙ РАСЧЁТ</span><div class="loan-metrics"><div class="loan-metric"><small>Сумма кредита</small><strong>${fmt(c.principal)}</strong></div><div class="loan-metric"><small>Процент за срок</small><strong>${Math.round(loanRate()*100)}%</strong></div><div class="loan-metric"><small>Переплата</small><strong>${fmt(c.interest)}</strong></div><div class="loan-metric"><small>Платёж в день</small><strong>${fmt(c.daily)}</strong></div></div><div class="loan-total">${fmt(c.total)}</div><small class="sub">Всего к возврату за ${loanDays} дней</small>`}
function reviewLoan(){loanAmount=document.getElementById('loanAmountInput')?.value||loanAmount;loanDown=document.getElementById('loanDownInput')?.value||loanDown;loanDays=Number(document.getElementById('loanDaysInput')?.value||loanDays);const c=loanCalc();if(!Number.isFinite(Number(loanAmount))||Number(loanAmount)<=0)return notify('Укажи корректную стоимость');if(Number(loanDown)<0||Number(loanDown)>=Number(loanAmount))return notify('Первоначальный взнос должен быть меньше стоимости');if(c.principal<=0)return notify('Сумма кредита должна быть больше нуля');loanStep=3;render()}
function approveLoan(){const c=loanCalc();data=readData();data.balance=Number(data.balance)||0;const firstDue=new Date(Date.now()+86400000).toLocaleDateString('ru-RU');const l={id:'VTS-LOAN-'+Date.now(),kind:loanKind,principal:c.principal,rate:loanRate(),interest:c.interest,total:c.total,daily:c.daily,days:Number(loanDays),paidDays:0,remaining:c.total,status:'active',firstDue,createdAt:new Date().toLocaleString('ru-RU')};let loans=[];try{loans=JSON.parse(localStorage.getItem('vts_bank_loans_v1')||'[]')}catch(e){};loans.unshift(l);localStorage.setItem('vts_bank_loans_v1',JSON.stringify(loans));data.balance+=c.principal;localStorage.setItem(DATA_KEY,JSON.stringify(data));state.history.unshift({id:l.id,kind:'Кредит',title:(loanKind==='truck'?'Кредит на грузовик':'Кредит на прицеп'),recipient:l.kind==='truck'?'Покупка грузовика':'Покупка прицепа',amount:c.principal,income:true,date:new Date().toLocaleString('ru-RU'),commission:0});save();loanDraft=l;loanStep=4;render();notify('Игровой кредит оформлен')}
function payLoanDay(id){let loans=[];try{loans=JSON.parse(localStorage.getItem('vts_bank_loans_v1')||'[]')}catch(e){};const l=loans.find(x=>x.id===id);if(!l||l.status!=='active')return notify('Активный кредит не найден');data=readData();data.balance=Number(data.balance)||0;const amount=Math.min(Number(l.daily)||0,Number(l.remaining)||0);if(amount<=0)return notify('Кредит уже погашен');if(amount>data.balance)return notify('Недостаточно средств для дневного платежа');data.balance-=amount;l.remaining=Math.max(0,l.remaining-amount);l.paidDays+=1;if(l.remaining<0.01||l.paidDays>=l.days){l.remaining=0;l.status='paid'}localStorage.setItem('vts_bank_loans_v1',JSON.stringify(loans));localStorage.setItem(DATA_KEY,JSON.stringify(data));state.history.unshift({id:'VTS-LOAN-PAY-'+Date.now(),kind:'Платёж по кредиту',title:'Погашение '+(l.kind==='truck'?'кредита на грузовик':'кредита на прицеп'),recipient:l.id,amount,income:false,date:new Date().toLocaleString('ru-RU'),commission:0});save();render();notify('Дневной платёж внесён')}
function saveHolder(){let v=document.getElementById('holderInput').value.trim();if(!v)return notify('Введите имя и фамилию');state.holder=v;let parts=v.split(/\s+/);data=readData();data.profile={...(data.profile||{}),name:parts[0]||'',lastName:parts.slice(1).join(' ')};localStorage.setItem(DATA_KEY,JSON.stringify(data));localStorage.setItem(PROFILE_KEY,JSON.stringify({...((()=>{try{return JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}catch(e){return {}}})()),name:parts[0]||'',lastName:parts.slice(1).join(' ')}));save();render();notify('Имя владельца обновлено на картах')}function editHolder(){setPage('settings')}
render();
</script></body></html>
