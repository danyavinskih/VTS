<style>
:root{--bg:#030b17;--panel:#07172a;--panel2:#0a2038;--line:#123b65;--blue:#087df5;--cyan:#20baff;--text:#edf6ff;--muted:#829bb8;--green:#25d58a;--red:#ff637b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#0b3260 0,transparent 50%),var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1240px;margin:auto;min-height:100vh;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{font-size:29px;font-weight:900;font-style:italic;letter-spacing:1px;color:#fff;text-shadow:0 0 22px #168dff}.brand span{color:#28aaff}.user{border:1px solid var(--line);background:#0b1e35;padding:10px 15px;border-radius:14px;color:#cfe5ff}.layout{display:grid;grid-template-columns:220px 1fr;gap:22px}.sidebar,.panel{background:linear-gradient(145deg,rgba(9,29,52,.96),rgba(3,14,29,.96));border:1px solid var(--line);border-radius:22px}.sidebar{padding:15px;height:max-content}.nav{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;color:var(--muted);padding:14px 13px;border-radius:12px;margin:3px 0}.nav.active,.nav:hover{background:linear-gradient(90deg,#0758b7,#0b2b51);color:white;box-shadow:inset 3px 0 var(--cyan)}.content{min-width:0}.heading{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}.heading h1{font-size:29px;margin:0}.sub{color:var(--muted);margin-top:5px}.panel{padding:22px;margin-bottom:18px}.balance{background:linear-gradient(120deg,#09284b,#061326);border:1px solid #14558b;border-radius:16px;padding:19px 22px}.balance small{color:#9eb9d8}.amount{font-size:34px;font-weight:750;margin:8px 0}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 23px}.action{background:linear-gradient(145deg,#0b2b4c,#06162a);border:1px solid #124574;border-radius:15px;padding:17px 12px;text-align:center;transition:.2s}.action:hover{border-color:#29aaff;transform:translateY(-2px)}.action .ico{font-size:24px;color:#53bdff;display:block;margin-bottom:8px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:19px 0 13px;font-size:18px;font-weight:700}.link{color:#35baff;background:none;border:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.mini-card{border:1px solid #14558a;border-radius:17px;padding:14px;background:linear-gradient(135deg,#0c2d54,#061329 60%,#0b3970);cursor:pointer;min-height:146px;position:relative;overflow:hidden}.mini-card:before,.bank-card:before{content:"";position:absolute;width:240px;height:160px;right:-80px;top:-45px;border-radius:50%;border:1px solid #1889e9;box-shadow:0 0 25px #0864be;transform:rotate(-20deg)}.mini-card>*{position:relative}.mini-top{display:flex;justify-content:space-between;font-weight:900;font-style:italic;color:#61c5ff}.chip{width:35px;height:26px;border-radius:7px;background:linear-gradient(135deg,#ffe9b1,#c6a46b);border:1px solid #fff1c7;margin:15px 0 10px}.mini-number{letter-spacing:2px;font-size:12px;color:#d8eaff}.mini-foot{display:flex;justify-content:space-between;font-size:12px;margin-top:10px}.add-card{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border:1px dashed #1c6aa5;border-radius:17px;min-height:146px;color:#9bcfff;background:#06172a}.plus{font-size:32px;color:#4abaff}.empty{padding:27px 10px;text-align:center;color:var(--muted)}.empty .doc{font-size:32px;color:#3988c9;margin-bottom:9px}.transactions{border:1px solid #12395e;border-radius:14px;overflow:hidden}.tx{display:flex;gap:13px;align-items:center;padding:15px;border-bottom:1px solid #102b48}.tx:last-child{border-bottom:0}.txicon{width:38px;height:38px;border-radius:12px;background:#102f51;display:grid;place-items:center;color:#56baff}.txmeta{flex:1}.txmeta small{display:block;color:var(--muted);margin-top:4px}.txamount{font-weight:700}.green{color:var(--green)}.red{color:var(--red)}.back{border:0;background:transparent;color:#9bcfff;font-size:16px;padding:0 0 15px}.bank-card{aspect-ratio:1.586;max-width:580px;width:100%;margin:0 auto 17px;perspective:1000px;cursor:pointer}.flip-inner{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}.bank-card.flipped .flip-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;overflow:hidden;border:1px solid #167ed4;background:radial-gradient(ellipse at 70% 25%,#0d65bd 0,transparent 40%),linear-gradient(135deg,#061a34,#041024 55%,#0b3670);padding:23px;box-shadow:0 12px 35px #0008,inset 0 0 25px #0a4e8a55}.face:after{content:"";position:absolute;width:150%;height:70%;left:-20%;top:20%;border-top:2px solid #168bff;transform:rotate(-18deg);filter:drop-shadow(0 0 8px #009cff);opacity:.7}.front>*{position:relative;z-index:1}.face-logo{display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:900;font-style:italic;color:#72ceff}.face-logo small{font-size:10px;letter-spacing:2px}.chip.big{width:48px;height:36px;margin:25px 0 17px}.wave{font-size:22px;margin-left:10px}.card-num{font-size:clamp(15px,2.4vw,24px);letter-spacing:2px;white-space:nowrap}.card-bottom{display:flex;align-items:end;justify-content:space-between;margin-top:23px}.holder{font-size:14px;text-transform:uppercase;letter-spacing:1px}.scheme{font-size:20px;font-weight:900;color:#fff}.back-face{transform:rotateY(180deg);padding:0}.magstripe{height:21%;background:#02050a;margin-top:10%}.signature{margin:20px 8% 0;background:#d9e4f1;color:#192b41;height:33px;display:flex;justify-content:flex-end;align-items:center;padding:0 12px;font-size:13px}.cvv{margin-right:10%;text-align:right;color:#9db9d6;font-size:11px}.back-copy{font-size:10px;color:#94b5d4;margin:18px 8%;max-width:70%}.card-summary{max-width:580px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:0 4px}.card-summary strong{display:block;font-size:25px;margin-top:4px}.card-actions{max-width:580px;margin:19px auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:1px solid #1788e8;background:linear-gradient(135deg,#087ff2,#0755b5);padding:13px 16px;border-radius:13px;font-weight:650}.btn.secondary{background:#092443;border-color:#17649d}.btn.ghost{background:transparent;border-color:#234866}.btn.full{width:100%;margin-top:10px}.list-options{max-width:580px;margin:20px auto 0;border:1px solid #123b62;border-radius:15px;overflow:hidden}.option{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #12314e;padding:17px;display:flex;justify-content:space-between;color:#cce4ff}.option:last-child{border:0}.form{max-width:560px;margin:auto}.field{display:block;margin:18px 0;color:#abc6e4;font-size:14px}.field input,.field select{display:block;width:100%;margin-top:8px;padding:14px;background:#06172a;border:1px solid #194c78;border-radius:12px;color:white;outline:none}.field input:focus,.field select:focus{border-color:#35baff}.hint{font-size:12px;color:var(--muted);line-height:1.5}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0b2c4c;border:1px solid #2685c6;padding:13px 18px;border-radius:12px;box-shadow:0 8px 30px #0008;z-index:10}.hidden{display:none!important}@media(max-width:780px){.app{padding:14px}.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:4px;padding:7px;border-radius:15px}.nav{min-width:max-content;width:auto;padding:11px}.nav span:last-child{font-size:13px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:15px}.heading h1{font-size:24px}.face{padding:15px}.chip.big{margin:14px 0 10px}.card-bottom{margin-top:15px}.holder{font-size:10px}.face-logo{font-size:19px}.bank-card{max-width:520px}.actions{gap:7px}.action{padding:13px 5px;font-size:13px}}@media(max-width:420px){.cards{grid-template-columns:1fr}.card-num{font-size:14px;letter-spacing:1px}.face{padding:12px}.chip.big{width:38px;height:29px;margin:12px 0 8px}.card-bottom{margin-top:12px}.scheme{font-size:16px}.face-logo{font-size:17px}.holder{font-size:9px}.card-summary strong{font-size:22px}}

.payment-heading{margin-bottom:20px}.payment-mark{font-weight:900;font-size:18px;letter-spacing:1px;color:#eaf6ff;background:linear-gradient(135deg,#123d6b,#07182c);border:1px solid #1b5a91;border-radius:13px;padding:11px 14px}.payment-mark span{color:#39b8ff;margin-left:5px}.pay-phone{padding:25px;background:radial-gradient(ellipse at 100% 0%,#103e70 0,transparent 42%),linear-gradient(135deg,#0a2038,#061326 75%);border-color:#164a78;margin-bottom:25px}.pay-title{display:flex;align-items:center;justify-content:space-between;gap:15px}.pay-title h2,.pay-methods h2{font-size:22px;margin:7px 0 0}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.8px;color:#42baff}.phone-icon{height:47px;width:47px;display:grid;place-items:center;border-radius:15px;background:#103d68;color:#65caff;font-size:30px;border:1px solid #1b6198}.search-recipient{display:flex;align-items:center;gap:12px;margin-top:24px;background:#0b1c30;border:1px solid #204a70;border-radius:15px;padding:0 17px;min-height:59px;color:#53baff}.search-recipient:focus-within{border-color:#35baff;box-shadow:0 0 0 3px #168bff1c}.search-recipient>span{font-size:25px}.search-recipient input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f2f8ff;font-size:16px;padding:17px 0}.search-recipient input::placeholder{color:#718aa5}.phone-extra{display:flex;align-items:center;gap:8px;color:#8ba8c7;font-size:12px;margin-top:13px}.secure-dot{width:7px;height:7px;border-radius:50%;background:#26d89b;box-shadow:0 0 10px #26d89b66}.phone-transfer-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-top:15px}.phone-transfer-fields .field{margin:7px 0 12px}.phone-transfer-fields .btn{grid-column:1/-1;display:flex;justify-content:center;gap:10px;align-items:center}.pay-methods{margin-bottom:22px}.pay-methods .section-title{margin-bottom:15px}.pay-methods .section-title h2{margin:0}.method-count{color:#5b8cb9;font-size:13px;letter-spacing:2px}.method-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.method-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:10px;min-height:176px;padding:19px 17px;border:1px solid #173c5e;border-radius:17px;background:linear-gradient(145deg,#0c223b,#071426);transition:transform .18s,border-color .18s}.method-card:hover{transform:translateY(-3px);border-color:#2587ce}.method-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;font-size:24px;font-weight:700}.method-icon.blue{color:#60baff;background:#103e6d}.method-icon.violet{color:#a9a2ff;background:#292650}.method-icon.cyan{color:#4ee0e8;background:#103b48}.method-card strong{font-size:15px;line-height:1.3}.method-card small{font-size:12px;color:#88a4c2;line-height:1.45}.method-arrow{position:absolute;right:15px;top:17px;color:#5aaee9;font-size:17px}.payment-note{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border:1px solid #153654;border-radius:15px;background:#07182a;color:#69bfff}.payment-note>span{font-size:20px}.payment-note strong{font-size:13px;color:#d8eaff}.payment-note p{font-size:12px;line-height:1.5;color:#829bb8;margin:5px 0 0}@media(max-width:650px){.pay-phone{padding:18px}.method-grid{grid-template-columns:1fr}.method-card{min-height:130px}.phone-transfer-fields{grid-template-columns:1fr}.phone-transfer-fields .btn{grid-column:auto}.payment-mark{font-size:15px;padding:9px 10px}.pay-title h2{font-size:19px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand">VTS <span>BANK</span></div><button class="user" id="userName" onclick="editHolder()">👤 Владелец ▾</button></header><div class="layout"><aside class="sidebar"><button class="nav active" data-page="home">⌂ <span>Главная</span></button><button class="nav" data-page="cards">▣ <span>Мои карты</span></button><button class="nav" data-page="transfer">⇄ <span>Переводы</span></button><button class="nav" data-page="payment">▤ <span>Платежи</span></button><button class="nav" data-page="history">◷ <span>История</span></button><button class="nav" data-page="settings">⚙ <span>Настройки</span></button></aside><main class="content" id="content"></main></div></div><div id="toast" class="toast hidden"></div>
<script>
const STORE='vts_bank_ui_v1', DATA_KEY='vts_data_v1', PROFILE_KEY='vts_profile_v1';let data=readData();let state=load();let page='home',selected=0,flipped=false;
function readData(){try{return JSON.parse(localStorage.getItem(DATA_KEY)||'{}')||{}}catch(e){return {}}}
function load(){let x={};try{x=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch(e){};let p={...(data.profile||{})};try{p={...p,...(JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')||{})}}catch(e){};let holder=[p.name||p.firstName,p.lastName].filter(Boolean).join(' ').trim()||p.fullName||p.nickname||'Водитель VTS';return {holder,cards:Array.isArray(x.cards)&&x.cards.length?x.cards:[{number:'4276'+Array.from({length:12},()=>Math.floor(Math.random()*10)).join(''),expiry:'12/29',balance:Number(data.balance)||0}],history:Array.isArray(x.history)?x.history:[]}}
function save(){localStorage.setItem(STORE,JSON.stringify(state));data=readData();data.balance=Number(data.balance)||0;localStorage.setItem(DATA_KEY,JSON.stringify(data))}function fmt(n){return Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽'}function digits(c){return c.number.slice(-4)}function mask(c){return '••••  ••••  ••••  '+digits(c)}function notify(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}function active(){return state.cards[selected]||state.cards[0]}function setPage(p){page=p;flipped=false;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function cardMarkup(c,large=false){return `<div class="${large?'bank-card':'mini-card'}" ${large?'id="flipCard" onclick="flipCard()"':'onclick="openCard('+state.cards.indexOf(c)+')"'}>${large?`<div class="flip-inner"><div class="face front"><div class="face-logo"><span>VTS<small> BANK</small></span><span>VTS</span></div><div style="display:flex;align-items:center"><div class="chip big"></div><span class="wave">)))</span></div><div class="card-num">${c.number.replace(/(.{4})/g,'$1 ').trim()}</div><div class="card-bottom"><div><div style="font-size:10px;color:#9bbbd9;margin-bottom:5px">VALID THRU</div><div>${c.expiry}</div><div class="holder" style="margin-top:9px">${esc(state.holder)}</div></div><div class="scheme">МИР</div></div></div><div class="face back-face"><div class="magstripe"></div><div class="signature">${digits(c)} &nbsp; <b>123</b></div><div class="cvv">SIGNATURE / CVV</div><div class="back-copy">Эта карта является виртуальной картой VTS BANK. При утере данных обратитесь в настройки карты.</div><div class="face-logo" style="position:absolute;right:8%;bottom:10%;font-size:22px">VTS <small>BANK</small></div></div></div>`:`<div class="mini-top"><span>VTS</span><span>◉</span></div><div class="chip"></div><div class="mini-number">${mask(c)}</div><div class="mini-foot"><span>${esc(state.holder)}</span><b>МИР</b></div>`}</div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){data=readData();let p={...(data.profile||{})};try{p={...p,...(JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')||{})}}catch(e){};state.holder=[p.name||p.firstName,p.lastName].filter(Boolean).join(' ').trim()||p.fullName||p.nickname||state.holder||'Водитель VTS';document.getElementById('userName').textContent='👤 '+state.holder+' ▾';let c=active();let html='';if(page==='home'){html=`<div class="heading"><div><h1>Банк VTS</h1><div class="sub">Ваши финансы под контролем</div></div></div><div class="balance"><small>Общий баланс</small><div class="amount">${fmt(Number(data.balance)||0)}</div><small>Средства на ваших картах</small></div><div class="actions"><button class="action" onclick="setPage('transfer')"><span class="ico">⇄</span>Перевести</button><button class="action" onclick="setPage('payment')"><span class="ico">▤</span>Оплатить</button><button class="action" onclick="setPage('cards')"><span class="ico">＋</span>Мои карты</button></div><div class="section-title">Мои карты <button class="link" onclick="setPage('cards')">Все ${state.cards.length}/3 ›</button></div><div class="cards">${state.cards.map(c=>cardMarkup(c)).join('')}${state.cards.length<3?`<button class="add-card" onclick="createCard()"><span class="plus">＋</span>Оформить карту</button>`:''}</div><div class="section-title">Последние операции <button class="link" onclick="setPage('history')">Все ›</button></div>${historyMarkup(3)}`}
else if(page==='cards'){html=`<button class="back" onclick="setPage('home')">‹ Назад</button><div class="heading"><div><h1>Мои карты</h1><div class="sub">Нажмите на карту, чтобы перевернуть её</div></div><span class="sub">${state.cards.length}/3</span></div>${state.cards.map((x,i)=>`<div style="margin-bottom:23px">${cardMarkup(x,true).replace('id="flipCard"','id="flipCard"')}<div class="card-summary"><div><span class="sub">${mask(x)}</span><strong>${fmt(x.balance)}</strong></div><button class="btn secondary" onclick="selected=${i};setPage('carddetail')">Управление</button></div></div>`).join('')}${state.cards.length<3?`<button class="add-card" style="width:100%;min-height:100px" onclick="createCard()"><span class="plus">＋</span>Оформить новую карту <small>Максимум 3 карты</small></button>`:''}`}
else if(page==='carddetail'){html=`<button class="back" onclick="setPage('cards')">‹ Мои карты</button><div class="heading"><div><h1>Карта ${selected+1}</h1><div class="sub">Нажмите на карту для переворота</div></div></div>${cardMarkup(c,true)}<div class="card-summary"><div><span class="sub">${mask(c)}</span><strong>${fmt(Number(data.balance)||0)}</strong></div></div><div class="card-actions"><button class="btn" onclick="setPage('transfer')">⇄ Перевести</button><button class="btn secondary" onclick="setPage('payment')">▤ Оплатить</button></div><div class="list-options"><button class="option" onclick="notify('Настройки карты скоро будут доступны')">⚙ Лимиты и настройки <span>›</span></button><button class="option" onclick="notify('В демо-версии блокировка не выполняет реальные операции')">♙ Блокировка карты <span>›</span></button><button class="option" onclick="notify('Это виртуальная карта VTS')">▣ Управление картой <span>›</span></button></div>`}
else if(page==='transfer'){html=`<button class="back" onclick="setPage('home')">‹ Главная</button><div class="panel form"><h1>Перевод</h1><div class="sub">Перевод между виртуальными счетами VTS</div><label class="field">С карты<select id="source">${state.cards.map((x,i)=>`<option value="${i}">${mask(x)} — ${fmt(x.balance)}</option>`).join('')}</select></label><label class="field">Получатель<input id="recipient" placeholder="Имя получателя или номер карты"></label><label class="field">Сумма, ₽<input id="sum" type="number" min="0.01" step="0.01" placeholder="0,00"></label><div class="hint">Это демонстрационный интерфейс VTS. Реальные банковские переводы не выполняются.</div><button class="btn full" onclick="submitOperation('transfer')">Перевести</button></div>`}
else if(page==='payment'){html=`<button class="back" onclick="setPage('home')">‹ Главная</button><div class="heading payment-heading"><div><h1>Платежи</h1><div class="sub">Переводите удобно — всё в одном месте</div></div><div class="payment-mark">VTS<span>PAY</span></div></div><section class="pay-phone panel"><div class="pay-title"><div><span class="eyebrow">БЫСТРЫЙ ПЕРЕВОД</span><h2>Перевод по телефону</h2></div><div class="phone-icon">⌕</div></div><label class="search-recipient"><span>⌕</span><input id="phoneRecipient" type="text" placeholder="Введите номер телефона или имя" autocomplete="off"></label><div class="phone-extra"><span class="secure-dot"></span>Перевод внутри демо-системы VTS</div><div class="phone-transfer-fields"><label class="field">С карты<select id="phoneSource">${state.cards.map((x,i)=>`<option value="${i}">${mask(x)} — ${fmt(x.balance)}</option>`).join('')}</select></label><label class="field">Сумма, ₽<input id="phoneSum" type="number" min="0.01" step="0.01" placeholder="Введите сумму"></label><button class="btn full" onclick="submitPhonePayment()">Продолжить перевод <span>→</span></button></div></section><section class="pay-methods"><div class="section-title"><div><h2>Способы перевода</h2><div class="sub">Выберите удобный вариант</div></div><span class="method-count">03</span></div><div class="method-grid"><button class="method-card" onclick="setPage('transfer')"><span class="method-icon blue">⇄</span><strong>Между счетами</strong><small>Перевод между картами VTS</small><span class="method-arrow">↗</span></button><button class="method-card" onclick="openPaymentMethod('card')"><span class="method-icon violet">▰</span><strong>По номеру карты</strong><small>Укажите карту получателя</small><span class="method-arrow">↗</span></button><button class="method-card" onclick="openPaymentMethod('other')"><span class="method-icon cyan">◎</span><strong>Другие платежи</strong><small>Услуги и покупки в VTS</small><span class="method-arrow">↗</span></button></div></section><div class="payment-note"><span>ⓘ</span><div><strong>Безопасно и просто</strong><p>Все операции здесь демонстрационные. Реальные банковские переводы не выполняются.</p></div></div>`}
else if(page==='history'){html=`<div class="heading"><div><h1>История операций</h1><div class="sub">Все ваши переводы и платежи</div></div></div>${historyMarkup()}`}
else {html=`<div class="heading"><div><h1>Настройки банка</h1><div class="sub">Управление демонстрационным профилем</div></div></div><div class="panel form"><label class="field">Имя и фамилия владельца карты<input id="holderInput" value="${esc(state.holder)}" maxlength="40"></label><button class="btn" onclick="saveHolder()">Сохранить профиль карты</button><p class="hint">Имя на всех картах обновится автоматически. В демо можно хранить до 3 виртуальных карт.</p><button class="btn secondary full" onclick="if(confirm('Удалить историю операций?')){state.history=[];save();render();notify('История очищена')} ">Очистить историю</button></div>`}
document.getElementById('content').innerHTML=html;if(flipped){let el=document.getElementById('flipCard');if(el)el.classList.add('flipped')}}
function historyMarkup(limit=Infinity){if(!state.history.length)return `<div class="panel empty"><div class="doc">▤</div><b>Здесь пока нет операций</b><div style="margin-top:6px">Ваши переводы и платежи появятся здесь</div></div>`;return `<div class="transactions">${state.history.slice(0,limit).map(x=>`<div class="tx"><div class="txicon">${x.kind==='Пополнение'?'↙':x.kind==='Перевод'?'⇄':'▤'}</div><div class="txmeta">${esc(x.title)}<small>${x.date} · ${x.kind}</small></div><div class="txamount ${x.income?'green':'red'}">${x.income?'+':'−'} ${fmt(x.amount)}</div></div>`).join('')}</div>`}
function flipCard(){flipped=!flipped;document.getElementById('flipCard')?.classList.toggle('flipped',flipped)}function openCard(i){selected=i;setPage('carddetail')}function createCard(){if(state.cards.length>=3)return notify('Можно создать максимум 3 карты');let n='4276'+Array.from({length:12},()=>Math.floor(Math.random()*10)).join('');state.cards.push({number:n,expiry:'12/30',balance:0});selected=state.cards.length-1;save();setPage('cards');notify('Новая карта VTS создана')}
function submitOperation(kind){let i=Number(document.getElementById('source').value),recipient=document.getElementById('recipient').value.trim(),amount=Number(document.getElementById('sum').value);if(!recipient)return notify('Укажите получателя или назначение');if(!Number.isFinite(amount)||amount<=0)return notify('Введите корректную сумму');let c=state.cards[i];data=readData();data.balance=Number(data.balance)||0;if(amount>data.balance)return notify('Недостаточно средств');data.balance-=amount;c.balance=data.balance;localStorage.setItem(DATA_KEY,JSON.stringify(data));state.history.unshift({kind:kind==='transfer'?'Перевод':'Оплата',title:recipient,amount,income:false,date:new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})});save();setPage('history');notify('Демо-операция записана в историю')}
function submitPhonePayment(){const recipient=(document.getElementById('phoneRecipient')?.value||'').trim();const amount=Number(document.getElementById('phoneSum')?.value);const source=Number(document.getElementById('phoneSource')?.value||0);if(!recipient)return notify('Введите номер телефона или имя');if(!Number.isFinite(amount)||amount<=0)return notify('Введите корректную сумму');if(amount>(Number(data.balance)||0))return notify('Недостаточно средств');const content=document.getElementById('content');content.innerHTML=`<div class="panel form"><h2>Подготовка перевода</h2><p class="sub">Получатель: ${esc(recipient)}</p><label class="field">С карты<select id="source">${state.cards.map((x,i)=>`<option value="${i}" ${i===source?'selected':''}>${mask(x)} — ${fmt(x.balance)}</option>`).join('')}</select></label><label class="field">Получатель<input id="recipient" value="${esc(recipient)}"></label><label class="field">Сумма, ₽<input id="sum" type="number" min="0.01" step="0.01" value="${amount}"></label><button class="btn full" onclick="submitOperation('transfer')">Подтвердить демо-перевод</button><button class="btn secondary full" onclick="setPage('payment')">Назад</button><p class="hint">Операция демонстрационная, реальные переводы не выполняются.</p></div>`}
function openPaymentMethod(kind){if(kind==='card'){setPage('transfer');const input=document.getElementById('recipient');if(input)input.placeholder='Введите номер карты получателя';notify('Укажите номер карты получателя')}else notify('Дополнительные платежи появятся в следующих обновлениях VTS')}
function saveHolder(){let v=document.getElementById('holderInput').value.trim();if(!v)return notify('Введите имя и фамилию');state.holder=v;let parts=v.split(/\s+/);data=readData();data.profile={...(data.profile||{}),name:parts[0]||'',lastName:parts.slice(1).join(' ')};localStorage.setItem(DATA_KEY,JSON.stringify(data));localStorage.setItem(PROFILE_KEY,JSON.stringify({...((()=>{try{return JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}catch(e){return {}}})()),name:parts[0]||'',lastName:parts.slice(1).join(' ')}));save();render();notify('Имя владельца обновлено на картах')}function editHolder(){setPage('settings')}
render();
</script></body></html>
